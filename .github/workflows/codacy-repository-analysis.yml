name: Codacy Repository Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codacy-repository-analysis:
    runs-on: ubuntu-latest
    name: Codacy Repository Analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Disable Codacy ErrorProne and UnusedCode categories
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: python3 .github/scripts/codacy_disable_categories.py --apply

      - name: Upload Codacy repository analysis results
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          upload: true
          max-allowed-issues: 2147483647

      - name: Reanalyze with the updated Codacy categories
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: python3 .github/scripts/codacy_disable_categories.py --apply --reanalyze-commit "$GITHUB_SHA"
