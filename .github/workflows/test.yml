name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  client-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*

      - run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bash curl git ca-certificates gnupg jq docker-compose python3
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
          echo "deb [signed-by=/usr/share/keyrings/google.gpg arch=amd64] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends google-chrome-stable

      - id: compose_loc
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          targets = {"docker-compose-testing.yml"}
          found = None
          for root, dirs, files in os.walk("."):
            if root.count(os.sep) > 6:
              dirs[:] = []
              continue
            for f in files:
              if f in targets:
                found = os.path.abspath(os.path.join(root, f))
                break
            if found:
              break
          if not found:
            sys.exit(1)
          d = os.path.dirname(found)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fp:
            fp.write(f"dir={d}\n")
            fp.write(f"file={found}\n")
          PY

      - env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(".env")
          p.write_text(os.environ["ENV_FILE"], encoding="utf-8")
          with p.open("a", encoding="utf-8") as fp:
            fp.write("\nTESTING_ENABLED=1\n")
          PY
          test -s .env

      - name: Prepare writable client-test runtime directories
        run: |
          set -euo pipefail
          mkdir -p \
            backend/workspace/resource/profile \
            backend/workspace/resource/tenant \
            backend/workspace/resource/system \
            backend/workspace/resource/case_artifacts \
            backend/workspace/parser/parser_files
          chmod -R a+rwX \
            backend/workspace/resource \
            backend/workspace/parser/parser_files

      - run: |
          set -euo pipefail
          rm -f backend/static/.maintenance
          rm -f backend/build/backups/.restore_in_progress
          chmod +x ./run.sh

      - run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true

      - run: |
          set -euo pipefail
          docker network inspect shared_bridge >/dev/null 2>&1 || docker network create shared_bridge
          docker network inspect orion_nexus_backend >/dev/null 2>&1 || docker network create orion_nexus_backend

      - name: Start the same testing stack used by run.sh -docs
        run: |
          set -euo pipefail
          SKIP_BACKEND_TESTS=1 ./run.sh build -t
          docker compose -p trusted-search -f docker-compose-testing.yml exec -T web sh -lc '
            for path in \
              /app/workspace/resource/profile \
              /app/workspace/resource/tenant \
              /app/workspace/resource/system \
              /app/workspace/resource/case_artifacts \
              /app/workspace/parser/parser_files; do
              if [ ! -w "$path" ]; then
                echo "Client-test runtime path is not writable: $path" >&2
                exit 1
              fi
            done
          '

      - name: Wait for test service
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            api_code="$(curl -sk --connect-timeout 2 --max-time 5 -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/api/test/ready || true)"
            client_code="$(curl -sk --connect-timeout 2 --max-time 5 -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/ || true)"
            echo "readiness attempt $i/180: API HTTP ${api_code:-000}, client HTTP ${client_code:-000}"
            if [ "$api_code" = "200" ] && [ "$client_code" = "200" ]; then
              exit 0
            fi
            if [ $((i % 12)) -eq 0 ]; then
              docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
              docker logs trusted-web-main --since 70s --tail=200 || true
            fi
            sleep 5
          done
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          docker logs trusted-web-main --tail=1000 || true
          docker logs trusted-web-nginx --tail=500 || true
          docker logs elasticsearch --tail=500 || true
          docker logs trustly-web-mongodb --tail=500 || true
          docker logs trusted-web-arangodb --tail=500 || true
          docker logs trusted-web-redis --tail=500 || true
          exit 1

      - name: Verify General alert scanner fixture
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            curl -fsS -X POST http://127.0.0.1:9400/generic_model/_refresh >/dev/null
            fixture_hits="$(curl -fsS -H 'Content-Type: application/json' http://127.0.0.1:9400/generic_model/_search --data '{"size":0,"query":{"match":{"m_domain":"bbcnewsd73hkzno2ini43t4gblxvycyac5aw4gnv7t2rccijh7745uqd.onion"}}}' | jq -r '.hits.total.value // 0')"
            echo "General alert fixture attempt $i/30: ${fixture_hits} matching documents"
            if [ "$fixture_hits" -gt 0 ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs trusted-web-main --tail=1000 || true
          docker logs elasticsearch --tail=1000 || true
          exit 1

      - name: Run client tests with coverage
        run: |
          set -euo pipefail
          cd client
          export npm_config_loglevel=error
          export NODE_OPTIONS=--no-deprecation
          mkdir -p coverage cypress/downloads cypress/error cypress/screenshots cypress/videos
          npx cypress verify
          ORION_COVERAGE=true CI=false GITHUB_ACTIONS=false npx cypress run --browser electron --config baseUrl=https://127.0.0.1:8443
          test -s coverage/lcov.info

      - name: Make client coverage paths repository relative
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib

          report = pathlib.Path("client/coverage/lcov.info")
          lines = report.read_text(encoding="utf-8", errors="ignore").splitlines()
          rewritten = []

          for line in lines:
              if line.startswith("SF:") and not line.startswith("SF:client/"):
                  line = "SF:client/" + line[3:].lstrip("./")
              rewritten.append(line)

          report.write_text("\n".join(rewritten) + "\n", encoding="utf-8")
          print(f"Rewrote {sum(1 for l in rewritten if l.startswith('SF:'))} source paths")
          PY

      - name: Capture client diagnostics on failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p client/cypress/diagnostics
          free -h >client/cypress/diagnostics/memory.txt || true
          df -h >client/cypress/diagnostics/disk.txt || true
          docker stats --no-stream >client/cypress/diagnostics/docker-stats.txt || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' >client/cypress/diagnostics/docker-containers.txt || true
          docker logs trusted-web-main >client/cypress/diagnostics/backend.log 2>&1 || true
          docker logs trusted-web-nginx >client/cypress/diagnostics/nginx.log 2>&1 || true
          docker logs elasticsearch >client/cypress/diagnostics/elasticsearch.log 2>&1 || true
          docker logs trustly-web-mongodb >client/cypress/diagnostics/mongodb.log 2>&1 || true
          docker logs trusted-web-arangodb >client/cypress/diagnostics/arangodb.log 2>&1 || true

      - name: Detect client artifacts
        if: always()
        id: client_artifacts
        run: |
          set -euo pipefail
          has_cypress=false
          has_coverage=false

          if find client/cypress/diagnostics client/cypress/downloads client/cypress/error client/cypress/screenshots client/cypress/videos -type f 2>/dev/null | grep -q .; then
            has_cypress=true
          fi

          if [ -s client/coverage/lcov.info ]; then
            has_coverage=true
          fi

          {
            echo "has_cypress=${has_cypress}"
            echo "has_coverage=${has_coverage}"
          } >> "$GITHUB_OUTPUT"

      - if: always() && steps.client_artifacts.outputs.has_cypress == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cypress-artifacts
          path: |
            client/cypress/diagnostics/
            client/cypress/downloads/
            client/cypress/error/
            client/cypress/screenshots/
            client/cypress/videos/
          if-no-files-found: ignore
          retention-days: 7

      - if: always() && steps.client_artifacts.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: client-coverage
          path: client/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Show client service logs on failure
        if: failure()
        run: |
          free -h || true
          df -h || true
          docker stats --no-stream || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          docker logs trusted-web-main --tail=1000 || true
          docker logs trusted-web-nginx --tail=500 || true
          docker logs elasticsearch --tail=500 || true
          docker logs trustly-web-mongodb --tail=500 || true
          docker logs trusted-web-arangodb --tail=500 || true

      - if: always()
        run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true

  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*

      - run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bash curl git ca-certificates gnupg jq docker-compose python3
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
          echo "deb [signed-by=/usr/share/keyrings/google.gpg arch=amd64] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends google-chrome-stable

      - run: |
          set -euo pipefail
          cd client
          export npm_config_loglevel=error
          export NODE_OPTIONS=--no-deprecation
          npm install
          npx ng build --configuration=instrumented

      - run: |
          set -euo pipefail
          echo "=== checking client build folder ==="
          if [ -d "client/build" ]; then
            find client/build -maxdepth 4 -type d -print || true
            find client/build -maxdepth 2 -type f -print | head -n 200 || true
          else
            exit 1
          fi

      - id: compose_loc
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          targets = {"docker-compose.yml","docker-compose.yaml","compose.yml","compose.yaml"}
          found = None
          for root, dirs, files in os.walk("."):
            if root.count(os.sep) > 6:
              dirs[:] = []
              continue
            for f in files:
              if f in targets:
                found = os.path.abspath(os.path.join(root, f))
                break
            if found:
              break
          if not found:
            sys.exit(1)
          d = os.path.dirname(found)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fp:
            fp.write(f"dir={d}\n")
            fp.write(f"file={found}\n")
          PY

      - env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(".env")
          p.write_text(os.environ["ENV_FILE"], encoding="utf-8")
          with p.open("a", encoding="utf-8") as fp:
            fp.write("\nTESTING_ENABLED=1\n")
          PY
          test -s .env

      - run: |
          set -euo pipefail
          rm -f backend/static/.maintenance
          rm -f backend/build/backups/.restore_in_progress
          chmod +x ./run.sh
          ./run.sh build -b
          sed -i '/^TESTING_ENABLED=/d' .env
          echo 'TESTING_ENABLED="1"' >> .env

      - run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true

      - run: |
          set -euo pipefail
          docker network inspect shared_bridge >/dev/null 2>&1 || docker network create shared_bridge
          docker network inspect orion_nexus_backend >/dev/null 2>&1 || docker network create orion_nexus_backend

      - run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          export COMPOSE_PROJECT_NAME="ci_backend_${{ github.run_id }}_${{ github.run_attempt }}"
          COMPOSE_PROFILES=local docker-compose -f "${{ steps.compose_loc.outputs.file }}" up -d --build web nginx

      - name: Wait for test service
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            code="$(curl -sk --connect-timeout 2 --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/test/ready || true)"
            echo "readiness attempt $i/180: HTTP ${code:-000}"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ $((i % 12)) -eq 0 ]; then
              docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
              docker logs trusted-web-main --since 70s --tail=200 || true
            fi
            sleep 5
          done
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          docker logs trusted-web-main --tail=1000 || true
          docker logs trusted-web-nginx --tail=500 || true
          docker logs trusted-web-elastic --tail=500 || true
          docker logs trustly-web-mongodb --tail=500 || true
          docker logs trusted-web-arangodb --tail=500 || true
          docker logs trusted-web-redis --tail=500 || true
          exit 1

      - name: Run backend tests with coverage
        run: |
          set -euo pipefail
          docker exec trusted-web-main sh -lc '
            set -e
            cd /app
            COVERAGE_FILE=/tmp/.coverage TESTING_ENABLED=1 PYTHONPATH=/app python -m pytest -q tests \
              --cov=orion --maxfail=1 --disable-warnings \
              --cov-report=xml:/tmp/backend-coverage.xml
          '

      - name: Generate backend coverage report
        run: |
          set -euo pipefail
          docker cp trusted-web-main:/tmp/backend-coverage.xml backend/coverage.xml
          test -s backend/coverage.xml
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path("backend/coverage.xml")
          tree = ET.parse(report)
          root = tree.getroot()

          for sources in root.findall("sources"):
              for source in list(sources):
                  sources.remove(source)
              ET.SubElement(sources, "source").text = "."

          rewritten = 0
          for element in root.iter("class"):
              filename = element.get("filename")
              if filename and not filename.startswith("backend/orion/"):
                  element.set("filename", f"backend/orion/{filename}")
                  rewritten += 1

          tree.write(report, encoding="utf-8", xml_declaration=True)
          print(f"Rewrote {rewritten} source paths")
          PY

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - if: always()
        run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true

  coverage-report:
    runs-on: ubuntu-latest
    needs: [client-tests, backend-tests]
    if: always() && !cancelled()

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Download client coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-coverage
          path: client/coverage

      - name: Download backend coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: backend-coverage
          path: backend

      - name: Detect coverage reports
        id: codacy_reports
        run: |
          set -euo pipefail
          reports=""
          if [ -s client/coverage/lcov.info ]; then
            reports="client/coverage/lcov.info"
          else
            echo "client coverage report missing"
          fi
          if [ -s backend/coverage.xml ]; then
            if [ -n "$reports" ]; then
              reports="${reports},backend/coverage.xml"
            else
              reports="backend/coverage.xml"
            fi
          else
            echo "backend coverage report missing"
          fi
          echo "reports=${reports}" >> "$GITHUB_OUTPUT"

      - name: Upload combined coverage to Codacy
        if: steps.codacy_reports.outputs.reports != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.codacy_reports.outputs.reports }}

      - name: Build merged coverage summary (client + backend)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          lcov_path = root / "client" / "coverage" / "lcov.info"
          backend_xml = root / "backend" / "coverage.xml"
          out_dir = root / "coverage-merged"
          out_dir.mkdir(parents=True, exist_ok=True)

          client_total = 0
          client_covered = 0
          if lcov_path.exists() and lcov_path.stat().st_size > 0:
            for raw in lcov_path.read_text(encoding="utf-8", errors="ignore").splitlines():
              if raw.startswith("DA:"):
                _, pair = raw.split("DA:", 1)
                parts = pair.split(",")
                if len(parts) != 2:
                  continue
                hits = int(parts[1])
                client_total += 1
                if hits > 0:
                  client_covered += 1

          backend_total = 0
          backend_covered = 0
          if backend_xml.exists() and backend_xml.stat().st_size > 0:
            cov = ET.parse(backend_xml).getroot()
            backend_total = int(cov.attrib.get("lines-valid", "0"))
            backend_covered = int(cov.attrib.get("lines-covered", "0"))

          if (client_total + backend_total) == 0:
            raise SystemExit("No client or backend coverage files were produced")

          total_lines = client_total + backend_total
          covered_lines = client_covered + backend_covered
          pct = (covered_lines / total_lines * 100.0) if total_lines else 0.0

          summary = {
            "client": {
              "covered_lines": client_covered,
              "total_lines": client_total,
              "line_coverage_percent": round((client_covered / client_total * 100.0) if client_total else 0.0, 2),
            },
            "backend": {
              "covered_lines": backend_covered,
              "total_lines": backend_total,
              "line_coverage_percent": round((backend_covered / backend_total * 100.0) if backend_total else 0.0, 2),
            },
            "combined": {
              "covered_lines": covered_lines,
              "total_lines": total_lines,
              "line_coverage_percent": round(pct, 2),
            },
          }

          (out_dir / "coverage-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          (out_dir / "coverage-summary.md").write_text(
            "\n".join(
              [
                "# Combined Coverage Summary",
                "",
                f"- Client (LCOV): {summary['client']['covered_lines']}/{summary['client']['total_lines']} ({summary['client']['line_coverage_percent']}%)",
                f"- Backend (Cobertura XML): {summary['backend']['covered_lines']}/{summary['backend']['total_lines']} ({summary['backend']['line_coverage_percent']}%)",
                f"- Combined: {summary['combined']['covered_lines']}/{summary['combined']['total_lines']} ({summary['combined']['line_coverage_percent']}%)",
                "",
              ]
            ),
            encoding="utf-8",
          )

          print((out_dir / "coverage-summary.md").read_text(encoding="utf-8"))
          PY

      - name: Detect merged coverage artifacts
        id: coverage_artifacts
        run: |
          set -euo pipefail
          has_coverage=false
          if [ -s coverage-merged/coverage-summary.json ] || [ -s coverage-merged/coverage-summary.md ]; then
            has_coverage=true
          fi
          echo "has_coverage=${has_coverage}" >> "$GITHUB_OUTPUT"

      - if: steps.coverage_artifacts.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-artifacts
          path: |
            backend/coverage.xml
            client/coverage/lcov.info
            coverage-merged/coverage-summary.json
            coverage-merged/coverage-summary.md
          if-no-files-found: ignore
          retention-days: 7
