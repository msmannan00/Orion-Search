<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="noindex, nofollow" name="robots">
    <link href="/maintenance-assets/logo_url_default.png" rel="icon" type="image/png">
    <link href="/maintenance-assets/logo_url_default.png" rel="apple-touch-icon">
    <title>Orion Intelligence Maintenance</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            align-items: flex-start;
            background:
                repeating-linear-gradient(0deg, rgb(255 255 255 / 0.9%) 0px, rgb(255 255 255 / 0.9%) 1px, transparent 1px, transparent 26px),
                repeating-linear-gradient(90deg, rgb(255 255 255 / 0.9%) 0px, rgb(255 255 255 / 0.9%) 1px, transparent 1px, transparent 26px),
                linear-gradient(180deg, #0e1626 0%, #0e1626 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding: 26svh 28px max(28px, env(safe-area-inset-bottom));
            width: 100%;
        }

        main {
            align-items: center;
            display: flex;
            flex-direction: column;
            max-width: 620px;
            min-width: 0;
            padding: 0 4px;
            text-align: center;
            width: 100%;
        }

        .logo {
            display: block;
            height: 82px;
            margin: 0 0 28px;
            opacity: 0.98;
            width: 82px;
        }

        .status {
            color: #57a5eb;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(15px, 5vw, 38px);
            font-weight: 800;
            line-height: 1.15;
            margin: 0 0 16px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: clip;
            white-space: nowrap;
        }

        p {
            color: #d0d0d0;
            font-size: 18px;
            line-height: 1.6;
            margin: 0;
            max-width: 540px;
            overflow-wrap: anywhere;
        }

        .home-link {
            background: #57a5eb;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            margin-top: 22px;
            padding: 10px 18px;
            text-decoration: none;
        }

        .meta {
            border-top: 1px solid #ffffff14;
            color: #9fb3c8;
            font-size: 14px;
            margin-top: 28px;
            padding-top: 18px;
        }

        @media (max-width: 560px) {
            body {
                padding: 16svh 18px max(22px, env(safe-area-inset-bottom));
            }

            .logo {
                height: 68px;
                margin-bottom: 22px;
                width: 68px;
            }

            h1 {
                font-size: clamp(15px, 5vw, 24px);
            }

            p {
                font-size: 15px;
                max-width: 320px;
            }

            .meta {
                font-size: 13px;
                max-width: 320px;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 14svh 14px max(20px, env(safe-area-inset-bottom));
            }

            .logo {
                height: 60px;
                width: 60px;
            }

            h1 {
                font-size: clamp(15px, 5vw, 19px);
            }

            p,
            .meta {
                font-size: 13px;
            }
        }

        @media (max-width: 340px) {
            body {
                padding-left: 10px;
                padding-right: 10px;
            }

            .logo {
                height: 54px;
                margin-bottom: 18px;
                width: 54px;
            }

            .status {
                font-size: 11px;
                margin-bottom: 12px;
            }

            h1 {
                font-size: clamp(14px, 4.9vw, 17px);
            }
        }

        @media (max-height: 520px) and (orientation: landscape) {
            body {
                padding-top: 8svh;
            }

            .logo {
                height: 52px;
                margin-bottom: 14px;
                width: 52px;
            }

            .status {
                margin-bottom: 10px;
            }

            h1 {
                font-size: clamp(22px, 4vw, 30px);
                margin-bottom: 10px;
            }

            p {
                font-size: 14px;
                line-height: 1.45;
            }

            .meta {
                font-size: 12px;
                margin-top: 16px;
                padding-top: 12px;
            }
        }

        .progress {
            margin: 22px 0 4px;
            width: 100%;
        }

        .progress-track {
            background: rgb(255 255 255 / 12%);
            border-radius: 999px;
            height: 6px;
            overflow: hidden;
            width: 100%;
        }

        .progress-value {
            background: linear-gradient(92deg, #4ea2f1, #2c7ac5);
            border-radius: 999px;
            height: 100%;
            transition: width 400ms ease;
            width: 0;
        }

        .progress-label {
            display: flex;
            font-size: 12px;
            justify-content: space-between;
            margin-top: 8px;
            opacity: 0.75;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
<main>
    <img alt="" class="logo" src="/maintenance-assets/logo_url_default.png">
    <div class="status">Maintenance</div>
    <h1>Orion is temporarily unavailable</h1>
    <p id="summary">Maintenance or update in progress. Please try again in a few moments.</p>
    <div class="progress" hidden id="progress">
        <div class="progress-track">
            <div class="progress-value" id="progress-value"></div>
        </div>
        <div class="progress-label"><span id="progress-message"></span><span id="progress-percent"></span></div>
    </div>
    <a class="home-link" href="/dashboard/home">Go to homepage</a>
    <div class="meta">The gateway is online and will reconnect automatically when the application is ready.</div>
</main>
<script>
    const summary = document.getElementById('summary');
    const progress = document.getElementById('progress');
    const progressValue = document.getElementById('progress-value');
    const progressMessage = document.getElementById('progress-message');
    const progressPercent = document.getElementById('progress-percent');

    const OPERATION_LABEL = {backup: 'Backup in progress', restore: 'Restore in progress'};

    const renderJob = (job) => {
        if (!job || job.status !== 'running') {
            progress.hidden = true;
            return false;
        }
        const percent = Math.max(0, Math.min(100, Number(job.progress) || 0));
        summary.textContent = OPERATION_LABEL[job.operation] || 'Maintenance in progress';
        progressMessage.textContent = job.message || '';
        progressPercent.textContent = percent + '%';
        progressValue.style.width = percent + '%';
        progress.hidden = false;
        return true;
    };

    const readJob = async () => {
        try {
            const response = await fetch('/api/admin/backups/status', {cache: 'no-store', credentials: 'include'});
            if (!response.ok) {
                return null;
            }
            return await response.json();
        } catch (_) {
            return null;
        }
    };

    const isBackOnline = async () => {
        try {
            const response = await fetch('/dashboard/home', {cache: 'no-store'});
            return response.ok;
        } catch (_) {
            return false;
        }
    };

    const tick = async () => {
        renderJob(await readJob());
        if (await isBackOnline()) {
            window.location.replace('/dashboard/home');
            return;
        }
        window.setTimeout(tick, 5000);
    };

    tick();
</script>
</body>
</html>
