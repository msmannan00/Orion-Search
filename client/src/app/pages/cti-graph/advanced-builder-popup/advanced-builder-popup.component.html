<div data-testid="cti-graph-adv-expanded-overlay" class="[&&]:!z-[9999] [&&]:!bg-[rgba(2,6,23,0.64)] [body.light-theme_&&]:!bg-[rgba(15,23,42,0.24)] backdrop-blur-[4px] overflow-y-auto [animation:uiModalOverlayFade_200ms_ease-out_both] [&.items-center]:[align-items:safe_center] fixed inset-0 flex items-start justify-center p-4 pt-[10vh]" @popupAnimation data-role="backdrop" (click)="onBackdrop($event)">
  <section data-testid="cti-graph-adv-expanded-modal" role="dialog" aria-modal="true" class="ui-graph-popup-panel [&&]:!border-[#2c3a4a] [&&]:!bg-[#1b2a3b] [&&]:!text-[#e1e8f0] [&&]:!shadow-[0_12px_40px_rgba(0,0,0,0.40)] origin-top [animation:slideUp_0.2s_ease-out_both] [body.light-theme_&&]:!border-[#d2deec] [body.light-theme_&&]:!bg-[#f7fbff] [body.light-theme_&&]:!text-[#172235] [body.light-theme_&&]:!shadow-[0_10px_28px_rgba(15,23,42,0.14)] ui-popup-shell [&&]:!border flex max-h-[calc(90dvh-32px)] w-[min(1180px,calc(100vw-32px))] flex-col overflow-hidden rounded-xl" (click)="$event.stopPropagation()">
    <div class="[&&]:!border-b [&&]:!border-b-[var(--color-border)] flex items-center justify-between gap-3 px-4 py-3">
      <div class="min-w-0">
        <h3 class="!text-[var(--color-text1)] truncate text-sm font-semibold">{{ 'Advanced Graph Builder' | translate }}</h3>
        <p class="!text-[var(--color-text4)] truncate text-xs">{{ 'Combine multiple graph fields with AND/OR' | translate }}</p>
      </div>
      <button data-testid="cti-graph-adv-expanded-close" type="button" (click)="closed.emit()" class="ui-popup-close inline-flex items-center justify-center p-0 leading-none text-[#ccc] [width:var(--ui-popup-close-width,42px)] [height:var(--ui-popup-close-height,42px)] [border-radius:var(--ui-popup-close-radius,8px)] [font-size:var(--ui-popup-close-font-size,28px)] [transition-property:color,background-color] [transition-duration:var(--ui-popup-close-duration,180ms)] [transition-timing-function:ease] hover:[&&]:!bg-[var(--color-blue-700)] hover:[&&]:!text-[var(--color-blue-640)] [.light-theme_&]:!text-[#667085] [.light-theme_&]:hover:!bg-[#eef5ff] [.light-theme_&]:hover:!text-[#1f2e47] shrink-0 [--ui-popup-close-font-size:20px]" [attr.aria-label]="'common.actions.close' | translate">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="space-y-1 overflow-y-auto px-4 py-3 [scrollbar-gutter:stable]">
      @for (filter of filters(); track filter.id; let i = $index) {
        <div data-testid="cti-graph-adv-row" class="grid items-center gap-0 py-1 md:grid-cols-[110px_1fr_2fr_auto] [&_button]:!bg-[var(--color-blue-720)] [&_button:hover]:!bg-[var(--color-blue-710)] [&_button:focus]:!bg-[var(--color-blue-720)]">
          <app-ui-dropdown
            class="[&_button]:rounded-r-none"
            testId="cti-graph-adv-operator-select"
            [options]="getOperatorOptions(i)"
            [selected]="getOperatorValue(filter, i)"
            [translateLabels]="true"
            [searchable]="false"
            [disabled]="i === 0"
            [menuPlacement]="'static'"
            [surface]="'default'"
            [size]="'default'"
            (valueChange)="operatorChange.emit({ filter, operator: $event, index: i })">
          </app-ui-dropdown>
          <app-ui-dropdown
            class="-ml-px [&_button]:rounded-none"
            testId="cti-graph-adv-field-select"
            [options]="searchOptions()"
            [selected]="filter.optionKey"
            [translateLabels]="true"
            [searchable]="true"
            [searchPlaceholder]="'Search fields' | translate"
            [menuPlacement]="'static'"
            [surface]="'default'"
            [size]="'default'"
            (valueChange)="optionChange.emit({ filter, optionKey: $event })">
          </app-ui-dropdown>
          @if (isClusterOption(filter.optionKey)) {
            <app-ui-dropdown
              class="-ml-px [&_button]:rounded-none"
              testId="cti-graph-adv-cluster-value-select"
              [options]="clusterValueOptions()"
              [selected]="getClusterValue(filter)"
              [translateLabels]="true"
              [searchable]="true"
              [searchPlaceholder]="'Search clusters' | translate"
              [menuPlacement]="'static'"
              [surface]="'default'"
              [size]="'default'"
              (valueChange)="clusterValueChange.emit({ filter, value: $event })">
            </app-ui-dropdown>
          }
          @else {
            <input data-testid="cti-graph-adv-value-input" [(ngModel)]="filter.value" [ngModelOptions]="{standalone: true}" type="text" [placeholder]="getOption(filter.optionKey).placeholder | translate" class="-ml-px h-10 w-full rounded-none border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 text-xs font-medium text-[var(--color-text1)] placeholder:text-[var(--color-text4)] outline-none transition-colors focus:border-[var(--color-blue-640)]" />
          }
          <div class="-ml-px flex items-center gap-0">
            <button data-testid="cti-graph-adv-delete-filter" type="button" (click)="removeFilter.emit(filter.id)" [disabled]="filters().length === 1" class="inline-flex h-10 w-10 items-center justify-center rounded-none border border-[var(--color-border)] bg-[var(--color-blue-720)] text-[var(--color-text2)] transition-[background-color,border-color,transform] duration-150 hover:border-[var(--color-blue-640)] hover:bg-[var(--color-blue-710)] disabled:cursor-not-allowed disabled:opacity-45">
              <i class="bi bi-trash3 text-[14px]"></i>
            </button>
            @if (i === filters().length - 1 && filters().length < maxFilters()) {
              <button data-testid="cti-graph-adv-add-filter" type="button" (click)="addFilter.emit()" class="-ml-px inline-flex h-10 w-10 items-center justify-center rounded-r-lg border border-[var(--color-border)] bg-[var(--color-blue-720)] text-[var(--color-text2)] transition-[background-color,border-color,transform] duration-150 hover:border-[var(--color-blue-640)] hover:bg-[var(--color-blue-710)]">
                <i class="bi bi-plus-lg text-[14px]"></i>
              </button>
            }
          </div>
        </div>
      }
    </div>

    <div class="[&&]:!border-t [&&]:!border-t-[var(--color-border)] flex justify-end px-4 py-3">
      <button data-testid="cti-graph-adv-expanded-execute" type="button" (click)="execute.emit()" class="inline-flex h-9 items-center gap-2 rounded-lg bg-[var(--color-blue-640)] px-3 text-xs font-semibold text-white transition-colors hover:bg-[var(--color-blue-630)]">
        <i class="bi bi-search text-[13px]"></i>
        {{ 'Search' | translate }}
      </button>
    </div>
  </section>
</div>
