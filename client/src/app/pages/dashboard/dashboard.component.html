@if (dashboardService.showSubscription()) {
  <app-pro-subscription
    (close)="hideSubscription()"
    data-testid="pro-subscription">
  </app-pro-subscription>
}

@if (!isCtiGraph()) {
  <div data-testid="dashboard-main" class="w-full max-w-[100vw] overflow-x-hidden">
    <span id="top"></span>
    <div class="grid h-screen min-h-[800px] w-full max-w-[100vw] grid-cols-[max-content_minmax(0,1fr)] items-stretch overflow-x-hidden overflow-y-visible bg-[var(--color-blue-900)]" id="dashboard__sidebar-main" data-testid="dashboard-sidebar-main">
      <input class="hidden" id="dashboard__menu-toggle" name="menu-input" type="radio" data-testid="menu-toggle">
      <div [ngClass]="{ 'p-0 overflow-y-auto': isMenuOpen, 'px-[7px] py-[8px] overflow-hidden': !isMenuOpen, 'transition-[width,padding] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] max-[900px]:transition-none': isMenuOpen, 'transition-none': !isMenuOpen, 'w-screen min-w-screen': isMenuOpen && isCompactViewport(), 'w-[300px] min-w-[300px]': isMenuOpen && !isCompactViewport(), 'w-[68px] min-w-[68px]': !isMenuOpen && isCompactViewport(), 'w-[70px] min-w-[70px]': !isMenuOpen && !isCompactViewport() }" class="h-full min-w-0 flex-none border-r border-[rgba(255,255,255,0.08)] bg-[var(--color-blue-900)] [scrollbar-color:var(--color-blue-880)_transparent] [body.light-theme_&]:!border-r-[#ffffff15] [body.light-theme_&]:!bg-[#172235]" data-testid="dashboard-sidebar">
        <app-dashboard-sidebar class="[body.light-theme_&]:!bg-[#172235]"
          (menuToggle)="toggleNavigation()"
          data-testid="dashboard-sidebar-component">
        </app-dashboard-sidebar>
      </div>
      <div [ngClass]="{ 'max-[900px]:hidden': isMenuOpen }" class="relative m-0 h-auto max-h-full min-w-0 flex-1 overflow-hidden overflow-x-hidden bg-[var(--color-blue-850)] z-[1]" data-testid="dashboard-shell">
        <div class="pointer-events-none absolute inset-x-0 top-0 h-[220px] bg-[var(--color-mono)]"></div>
        <div class="relative z-[1] flex h-[1vh] min-h-full w-full min-w-0 max-w-full flex-col overflow-y-auto overflow-x-hidden" id="dashboard-container" data-testid="dashboard-container">
          @if (!isCompactViewport()) {
            <app-dashboard-header data-testid="dashboard-header"></app-dashboard-header>
          }
          <span [class.dashboard-route-fade-a]="routeFadePhase === 'a'" [class.dashboard-route-fade-b]="routeFadePhase === 'b'" [ngClass]="{ 'w-screen': authService.getIsMobileDemo(), 'z-[1300]': (isFilterOpen$ | async) }" class="[&&]:![background:repeating-linear-gradient(0deg,rgba(255,255,255,0.009)_0,rgba(255,255,255,0.009)_1px,transparent_1px,transparent_26px),repeating-linear-gradient(90deg,rgba(255,255,255,0.009)_0,rgba(255,255,255,0.009)_1px,transparent_1px,transparent_26px),linear-gradient(180deg,var(--color-blue-830)_0%,var(--color-blue-850)_100%)] [body.light-theme_&&]:![background:repeating-linear-gradient(0deg,rgba(15,23,42,0.013)_0,rgba(15,23,42,0.013)_1px,transparent_1px,transparent_26px),repeating-linear-gradient(90deg,rgba(15,23,42,0.013)_0,rgba(15,23,42,0.013)_1px,transparent_1px,transparent_26px),linear-gradient(180deg,#e7eff9_0%,#e7eff9_100%)] relative m-0 block w-full min-w-0 max-w-full flex-1 overflow-x-hidden" data-testid="dashboard-body">
            <router-outlet #routerOutlet="outlet" data-testid="router-outlet"></router-outlet>
          </span>
        </div>
      </div>
    </div>
  </div>
}

@if (isCtiGraph()) {
  <div data-testid="cti-graph-container">
    <router-outlet data-testid="cti-router-outlet"></router-outlet>
  </div>
}

@if (demoTourMounted && shouldShowDemoTour()) {
  <app-demo-tour></app-demo-tour>
}

@if (scanNotificationService.duplicateScanPrompt(); as duplicatePrompt) {
  <app-confirmation-popup
    [message]="duplicatePrompt.message"
    [confirmLabel]="'Run New Scan'"
    [warning]="true"
    [showCancel]="false"
    (confirmed)="handleDuplicateScanChoice($event)">
  </app-confirmation-popup>
}
