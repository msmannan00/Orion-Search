@if (isPanelMenuOpen) {
  <div data-testid="geo-fencing-panel-menu" class="map-overlay-menu absolute right-3 top-16 z-[999] flex min-h-[64px] w-[248px] flex-col rounded-[12px] border border-[#e5e7eb] bg-white p-[10px] text-[15px] shadow-[0_16px_30px_rgba(2,6,23,0.14)] animate-[ui-popup-flyout-in_160ms_ease-out_both] max-[943px]:right-2 max-[943px]:top-[88px] max-[520px]:top-[136px] max-[520px]:w-[min(248px,calc(100%-16px))]">
    <div class="pointer-events-none absolute top-[-10px] right-[16px] h-0 w-0 border-l-[8px] border-r-[8px] border-b-[10px] border-l-transparent border-r-transparent border-b-white"></div>
    <div class="max-h-[132px] overflow-y-auto pr-[2px]">
      @if (isThreatView) {
        <button type="button" data-testid="geo-fencing-panel-menu-filter" class="flex w-full cursor-pointer items-center gap-[10px] rounded-[8px] px-[8px] py-[10px] text-left text-[14px] font-medium text-[#172235] transition-colors hover:bg-[#f5f7fa]" (click)="threatFiltersOpened.emit()">
          <svg viewBox="0 0 16 16" class="h-5 w-5 shrink-0" fill="none" aria-hidden="true">
            <path d="M1.75 2.75h12.5L9.5 8.2v4.05l-3 1.5V8.2z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"></path>
          </svg>
          <span class="min-w-0 truncate">{{ 'Filter' | translate }}</span>
        </button>
      } @else {
        @for (tab of panelTabs; track tab.id) {
          <button type="button" [attr.data-testid]="'geo-fencing-panel-tab-' + tab.id" class="flex w-full cursor-pointer items-center gap-[10px] rounded-[8px] px-[8px] py-[10px] text-left text-[14px] font-medium transition-colors" [ngClass]="activePanel === tab.id ? 'bg-[#eef6ff] text-[#0f5fa8]' : 'text-[#172235] hover:bg-[#f5f7fa]'" (click)="panelOpened.emit(tab.id)">
            @if (tab.id === 'dashboard') {
              <svg viewBox="0 0 16 16" class="h-5 w-5 shrink-0" fill="currentColor" aria-hidden="true">
                <path d="M1.5 1.5h5v5h-5zm8 0h5v5h-5zm-8 8h5v5h-5zm8 0h5v5h-5z"></path>
              </svg>
            } @else {
              <i class="bi bi-images flex h-5 w-5 shrink-0 items-center justify-center text-[16px] leading-none" aria-hidden="true"></i>
            }
            <span class="min-w-0 truncate">{{ tab.label | translate }}</span>
          </button>
        }
      }
      <button type="button" data-testid="geo-fencing-panel-menu-clear-selections" class="flex w-full cursor-pointer items-center gap-[10px] rounded-[8px] px-[8px] py-[10px] text-left text-[14px] font-medium text-[#172235] transition-colors hover:bg-[#f5f7fa]" (click)="selectionsCleared.emit()">
        <svg viewBox="0 0 16 16" class="h-5 w-5 shrink-0" fill="none" aria-hidden="true">
          <path d="M4.25 4.25 11.75 11.75M11.75 4.25 4.25 11.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
          <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.25"></circle>
        </svg>
        <span class="min-w-0 truncate">{{ 'Clear all selections' | translate }}</span>
      </button>
    </div>
  </div>
}

@if (isMapView && isPanelPopupOpen) {
  <div data-testid="geo-fencing-panel-popup" class="map-overlay-menu absolute bottom-3 right-3 top-16 z-[930] flex w-[min(380px,calc(100%-24px))] flex-col overflow-hidden rounded-[14px] border border-white/15 bg-[rgba(8,16,27,0.94)] shadow-[0_20px_48px_rgba(2,6,23,.55)] backdrop-blur-md animate-[ui-popup-panel-in_180ms_ease-out_both] [body.light-theme_&]:border-[#d2deec] [body.light-theme_&]:bg-[#f7fbff]/95 [body.light-theme_&]:shadow-[0_18px_44px_rgba(15,23,42,.14)] max-[1100px]:relative max-[1100px]:left-auto max-[1100px]:right-auto max-[1100px]:top-auto max-[1100px]:bottom-auto max-[1100px]:z-10 max-[1100px]:mx-3 max-[1100px]:mt-3 max-[1100px]:h-auto max-[1100px]:w-auto max-[1100px]:overflow-visible max-[1100px]:rounded-[10px] max-[1100px]:shadow-none max-[640px]:mx-2 max-[640px]:rounded-[8px]">
    <div class="flex shrink-0 items-center justify-between border-b border-white/10 px-3 py-2 [body.light-theme_&]:border-[#d8e3f0] max-[420px]:px-2">
      <div data-testid="geo-fencing-panel-title" class="text-[18px] font-semibold uppercase tracking-[0.08em] text-[var(--color-text3)] max-[420px]:text-[14px]">{{ activePanelLabel | translate }}</div>
      <button data-testid="geo-fencing-panel-close" type="button" class="ui-popup-close inline-flex items-center justify-center p-0 leading-none text-[#ccc] [width:var(--ui-popup-close-width,42px)] [height:var(--ui-popup-close-height,42px)] [border-radius:var(--ui-popup-close-radius,8px)] [font-size:var(--ui-popup-close-font-size,28px)] [transition-property:color,background-color] [transition-duration:var(--ui-popup-close-duration,180ms)] [transition-timing-function:ease] hover:[&&]:!bg-[var(--color-blue-700)] hover:[&&]:!text-[var(--color-blue-640)] [.light-theme_&]:!text-[#667085] [.light-theme_&]:hover:!bg-[#eef5ff] [.light-theme_&]:hover:!text-[#1f2e47] right-5 top-5 border-none bg-transparent [--ui-popup-close-duration:200ms] hover:bg-[var(--color-blue-700)] hover:text-[var(--color-blue-640)] [body.light-theme_&]:text-[#667085] [body.light-theme_&]:hover:bg-[#eef5ff] [body.light-theme_&]:hover:text-[#1f2e47] max-[420px]:[--ui-popup-close-height:36px] max-[420px]:[--ui-popup-close-width:36px]" (click)="panelClosed.emit()" [attr.aria-label]="'Close popup' | translate">×</button>
    </div>
    <div class="min-h-0 flex-1 overflow-y-auto max-[1100px]:overflow-visible">
      <ng-content></ng-content>
    </div>
  </div>
}
