@if (isVisible()) {
  <div class="fade-in-dashboard-item m-[15px] mx-[32px] max-h-[40vh] overflow-auto rounded-[12px] border border-[var(--color-border)] bg-[var(--color-blue-730)] px-[19px] py-[15px] shadow-[0_4px_8px_rgba(0,0,0,0.1)] [scrollbar-width:auto] [scrollbar-color:var(--color-blue-880)_transparent] [&::-webkit-scrollbar]:w-[6px] [&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar-thumb]:bg-[var(--color-blue-880)] [&::-webkit-scrollbar-thumb]:rounded-[10px] [.light-theme_&]:!border-[#d4dfeb] [.light-theme_&]:!bg-white [.light-theme_&]:!shadow-[0_5px_16px_rgba(15,23,42,0.065)]">
    <div class="flex items-start">
      <img alt="" aria-hidden="true" class="mt-[3px] ui-action-icon" height="25" src="assets/images/shared/theme/ai.svg" width="25" />
      <p class="ml-[8px] mb-[24px] text-[22px] font-medium font-[Roboto] text-[var(--color-text1)]">{{ 'AI Report' | translate }}</p>
    </div>
    @if (isLoading()) {
      <div class="flex items-center gap-2 text-[14px] font-normal text-[var(--color-text1)]">
        <span class="inline-flex h-2.5 w-2.5 animate-pulse rounded-full bg-[var(--color-blue-640)]"></span>
        <span class="inline-flex h-2.5 w-2.5 animate-pulse rounded-full bg-[var(--color-blue-640)] [animation-delay:140ms]"></span>
        <span class="inline-flex h-2.5 w-2.5 animate-pulse rounded-full bg-[var(--color-blue-640)] [animation-delay:280ms]"></span>
        <span>{{ step() }}</span>
      </div>
    } @else {
      <p class="whitespace-pre-wrap text-[14px] font-normal text-[var(--color-text1)]">
        {{ summary() }}
      </p>
    }
  </div>
}
