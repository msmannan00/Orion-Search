@if (isOpen()) {
  <div class="[&&]:!z-[9999] [&&]:!bg-[rgba(2,6,23,0.64)] backdrop-blur-[4px] overflow-y-auto [animation:uiModalOverlayFade_200ms_ease-out_both] [&.items-center]:[align-items:safe_center] fixed inset-0 z-50 flex items-center justify-center p-4" (click)="onClose()">
    <div data-testid="password-scheme-modal" class="ui-graph-popup-panel [&&]:!border-[#2c3a4a] [&&]:!bg-[#1b2a3b] [&&]:!text-[#e1e8f0] [&&]:!shadow-[0_12px_40px_rgba(0,0,0,0.40)] origin-top [animation:slideUp_0.2s_ease-out_both] [body.light-theme_&&]:!border-[#d2deec] [body.light-theme_&&]:!bg-[#f7fbff] [body.light-theme_&&]:!text-[#172235] [body.light-theme_&&]:!shadow-[0_10px_28px_rgba(15,23,42,0.14)] ui-popup-shell [&&]:!border w-full max-w-[520px] rounded-2xl p-6" (click)="$event.stopPropagation()">
      <div class="flex items-start justify-between">
        <div>
          <div data-testid="password-scheme-title" class="!text-[var(--color-text1)] text-lg font-semibold">{{ 'Password Scheme Filter' | translate }}</div>
          <div class="!text-[var(--color-text4)] text-sm">{{ 'Length range and character requirements' | translate }}</div>
        </div>
        <button class="ui-popup-close inline-flex items-center justify-center p-0 leading-none text-[#ccc] [width:var(--ui-popup-close-width,42px)] [height:var(--ui-popup-close-height,42px)] [border-radius:var(--ui-popup-close-radius,8px)] [font-size:var(--ui-popup-close-font-size,28px)] [transition-property:color,background-color] [transition-duration:var(--ui-popup-close-duration,180ms)] [transition-timing-function:ease] hover:[&&]:!bg-[var(--color-blue-700)] hover:[&&]:!text-[var(--color-blue-640)] [.light-theme_&]:!text-[#667085] [.light-theme_&]:hover:!bg-[#eef5ff] [.light-theme_&]:hover:!text-[#1f2e47]" type="button" [attr.aria-label]="'common.actions.close' | translate" (click)="onClose()">×</button>
      </div>
      <div class="mt-6 space-y-4">
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label class="text-xs font-semibold text-[var(--color-text4)]">{{ 'Min Length' | translate }}</label>
            <input data-testid="password-scheme-min-length" class="ui-popup-input [&&]:!border-[#2c3a4a] [&&]:!bg-[#152230] [&&]:!text-[#e1e8f0] [&&]:!shadow-none placeholder:[&&]:!text-[#5a6e84] focus:[&&&]:!border-[#57a5eb] focus:[&&&]:!bg-[#1a2835] focus:[&&&]:!shadow-[0_0_0_2px_rgb(87_165_235/22%)] focus:[&&&]:!outline-none [.light-theme_&&]:!border-[#c7d5e6] [.light-theme_&&]:!bg-white [.light-theme_&&]:!text-[#172235] [.light-theme_&&]:placeholder:!text-[#64748b] [.light-theme_&&]:focus:!border-[#2b90ee] [.light-theme_&&]:focus:!bg-white [.light-theme_&&]:focus:!shadow-[0_0_0_3px_rgb(43_144_238/16%)] mt-2 w-full rounded-md px-3 py-2 text-sm" type="number" min="0" inputmode="numeric" placeholder="0" [(ngModel)]="filter.minLength" (ngModelChange)="normalizeRange()" />
          </div>
          <div>
            <label class="text-xs font-semibold text-[var(--color-text4)]">{{ 'Max Length' | translate }}</label>
            <input data-testid="password-scheme-max-length" class="ui-popup-input [&&]:!border-[#2c3a4a] [&&]:!bg-[#152230] [&&]:!text-[#e1e8f0] [&&]:!shadow-none placeholder:[&&]:!text-[#5a6e84] focus:[&&&]:!border-[#57a5eb] focus:[&&&]:!bg-[#1a2835] focus:[&&&]:!shadow-[0_0_0_2px_rgb(87_165_235/22%)] focus:[&&&]:!outline-none [.light-theme_&&]:!border-[#c7d5e6] [.light-theme_&&]:!bg-white [.light-theme_&&]:!text-[#172235] [.light-theme_&&]:placeholder:!text-[#64748b] [.light-theme_&&]:focus:!border-[#2b90ee] [.light-theme_&&]:focus:!bg-white [.light-theme_&&]:focus:!shadow-[0_0_0_3px_rgb(43_144_238/16%)] mt-2 w-full rounded-md px-3 py-2 text-sm" type="number" min="0" inputmode="numeric" placeholder="0" [(ngModel)]="filter.maxLength" (ngModelChange)="normalizeRange()" />
          </div>
        </div>
        <div class="h-px w-full bg-[var(--color-divider)]"></div>
        <div class="space-y-2">
          <label class="flex items-center gap-2 text-sm text-[var(--color-text3)]">
            <input data-testid="password-scheme-has-alphabets" type="checkbox" class="h-4 w-4 accent-[var(--color-blue-640)]" [(ngModel)]="filter.hasAlphabets" />
            <span>{{ 'Has Alphabets' | translate }}</span>
          </label>
          <label class="flex items-center gap-2 text-sm text-[var(--color-text3)]">
            <input data-testid="password-scheme-has-numbers" type="checkbox" class="h-4 w-4 accent-[var(--color-blue-640)]" [(ngModel)]="filter.hasNumbers" />
            <span>{{ 'Has Numbers' | translate }}</span>
          </label>
          <label class="flex items-center gap-2 text-sm text-[var(--color-text3)]">
            <input type="checkbox" class="h-4 w-4 accent-[var(--color-blue-640)]" [(ngModel)]="filter.hasSpecialChars" />
            <span>{{ 'Has Special Characters' | translate }}</span>
          </label>
        </div>
      </div>
      <div class="mt-6 flex items-center justify-end gap-2">
        <button class="ui-popup-btn-secondary border [&&]:!border-[#4a5f77] [&&]:!bg-transparent [&&]:!text-[#e1e8f0] [&&]:!px-[14px] [&&]:!py-[6px] [&&]:!h-auto [&&]:!min-w-0 [border-radius:var(--ui-popup-button-radius,6px)] [font-size:var(--ui-popup-button-font-size,13px)] [font-weight:var(--ui-popup-button-font-weight,500)] [transition-property:var(--ui-popup-button-transition,background-color,border-color)] [transition-duration:var(--ui-popup-button-duration,180ms)] [transition-timing-function:ease] hover:[&&&]:!border-[#5a7594] hover:[&&&]:!bg-[rgb(74_95_119/10%)] [--ui-popup-button-font-size:14px] [--ui-popup-button-font-weight:600] [.light-theme_&&]:!border-[#c7d5e6] [.light-theme_&&]:!bg-transparent [.light-theme_&&]:!text-[#1f2e47] [.light-theme_&&]:hover:!border-[#aac0da] [.light-theme_&&]:hover:!bg-[#eef5ff]" type="button" (click)="onClose()">{{ 'common.actions.cancel' | translate }}</button>
        <button data-testid="password-scheme-search" class="ui-popup-btn-primary [&&]:!border-0 [&&]:!bg-[linear-gradient(135deg,#57a5eb_0%,#0ea5e9_100%)] [&&]:!text-white [&&]:!shadow-[0_1px_4px_rgb(87_165_235/25%)] [&&]:!px-[14px] [&&]:!py-[6px] [&&]:!h-auto [&&]:!min-w-0 [border-radius:var(--ui-popup-button-radius,6px)] [font-size:var(--ui-popup-button-font-size,13px)] [font-weight:var(--ui-popup-button-font-weight,500)] [transition-property:var(--ui-popup-button-transition,background-color,transform,box-shadow)] [transition-duration:var(--ui-popup-button-duration,180ms)] [transition-timing-function:ease] hover:[&&&]:!bg-[linear-gradient(135deg,#6bb5ff_0%,#1eb5f9_100%)] hover:[&&&]:!-translate-y-px hover:[&&&]:!shadow-[0_2px_6px_rgb(87_165_235/30%)] active:[&&&]:!translate-y-0 [--ui-popup-button-font-size:14px] [--ui-popup-button-font-weight:600]" type="button" (click)="onSearch()">{{ 'Search' | translate }}</button>
      </div>
    </div>
  </div>
}
