<div data-testid="social-graph-root" class="ui-social-root-bg flex h-[100dvh] min-h-0 w-screen flex-col overflow-hidden bg-[var(--color-blue-850)] text-[var(--color-text2)] [.light-theme_&]:!bg-[#e7eff9]">
    <main class="relative min-h-0 flex-grow [.light-theme_&]:!bg-[#e7eff9]">
        <input data-testid="social-image-file-input" type="file" #imageInput class="hidden" (change)="onImageSelected($event)" accept="image/png, image/jpeg, image/webp, image/gif">
        <div class="flex h-full min-h-0 w-full flex-col overflow-hidden [.light-theme_&]:!bg-[#e7eff9]">
          <div class="relative flex min-h-0 flex-grow flex-row">
            <app-home-menu
              class="flex flex-shrink-0 flex-col overflow-hidden border-r border-[#ffffff12] bg-[#172235]"
              [isCollapsed]="isHomeMenuCollapsed()"
              [jobs]="jobs()"
              [resultUsernames]="resultUsernames()"
              [loadingUsernames]="loadingUsernames()"
              [activeUsername]="activeUsername()"
              (toggle)="onHomeMenuToggled()"
              (jobClicked)="handleCompletedJobClick($event)"
              (cancelScan)="cancelScan($event)"
              (retryScan)="retryScan($event)"
              (deleteRequested)="openDeleteConfirmation($event)"
              (stopFetches)="onStopFetches($event)">
            </app-home-menu>

            <main class="ui-social-dashboard-shell relative flex min-h-0 flex-grow flex-col bg-transparent [.light-theme_&]:!bg-[#e7eff9]">
              <div class="ui-social-topbar relative z-[1100] flex h-[60px] w-full flex-shrink-0 items-center justify-between overflow-visible border-b border-[var(--color-border)] bg-[var(--color-mono)] p-0">
                <app-social-breadcrumb [profileLabel]="profileBreadcrumbLabel()" (backClicked)="onHeaderBack()"></app-social-breadcrumb>

                <div class="mr-0 flex shrink-0 items-center">
                  <app-profile></app-profile>
                </div>
              </div>

              <div class="ui-social-dashboard-body [&&]:![background:repeating-linear-gradient(0deg,rgba(255,255,255,0.009)_0,rgba(255,255,255,0.009)_1px,transparent_1px,transparent_26px),repeating-linear-gradient(90deg,rgba(255,255,255,0.009)_0,rgba(255,255,255,0.009)_1px,transparent_1px,transparent_26px),linear-gradient(180deg,var(--color-blue-830)_0%,var(--color-blue-850)_100%)] [body.light-theme_&&]:![background:repeating-linear-gradient(0deg,rgba(15,23,42,0.013)_0,rgba(15,23,42,0.013)_1px,transparent_1px,transparent_26px),repeating-linear-gradient(90deg,rgba(15,23,42,0.013)_0,rgba(15,23,42,0.013)_1px,transparent_1px,transparent_26px),linear-gradient(180deg,#e7eff9_0%,#e7eff9_100%)] flex min-h-0 flex-1 flex-col overflow-hidden">
                <div class="flex-shrink-0 py-4">
                  <div class="mx-auto w-full max-w-[1480px] px-4">
                    <div class="flex w-full flex-wrap items-center gap-2">
                      <div data-testid="social-scan-control" class="relative min-w-[280px] flex-1 lg:max-w-md">
                        <div class="pointer-events-none absolute inset-y-0 left-0 z-10 flex items-center pl-4">
                          <i class="bi bi-search h-5 w-5 leading-none text-[var(--color-text4)]"></i>
                        </div>
                        <input data-testid="social-scan-input" type="text" [placeholder]="'Search username or handle...' | translate" [value]="homeMenuSearchTerm()" (input)="onDashboardScanInput($event)" (keyup.enter)="triggerScan()" (keydown.arrowleft)="$event.stopPropagation()" (keydown.arrowright)="$event.stopPropagation()" (keydown.home)="$event.stopPropagation()" (keydown.end)="$event.stopPropagation()" class="ui-graph-toolbar-input relative z-0 block h-10 w-full rounded-full border-0 bg-[var(--color-blue-800)]/90 pl-11 pr-36 text-[var(--color-text2)] shadow-lg ring-1 ring-inset ring-[var(--color-border)] backdrop-blur-sm placeholder:text-[var(--color-text4)] focus:outline-none focus:ring-2 focus:ring-[var(--color-blue-640)] sm:text-sm sm:leading-6 [.dark-theme_&]:!bg-[rgba(51,65,85,0.6)] [.light-theme_&]:!bg-[rgba(255,255,255,0.94)]" />
                        <div class="ui-graph-toolbar-action-shell absolute inset-y-1 right-1 flex items-center rounded-full bg-[var(--color-blue-720)]/80 py-1 pl-1 pr-0 [.dark-theme_&]:!bg-[#33415580] [.light-theme_&]:!bg-[rgba(226,236,247,0.92)]">
                          <button data-testid="social-image-upload-trigger" type="button" [title]="'Scan by image' | translate" [attr.aria-label]="'Scan by image' | translate" (click)="$event.stopPropagation(); triggerImageUpload()" class="flex h-8 w-8 items-center justify-center rounded-full text-[var(--color-text2)] transition-colors hover:bg-[var(--color-blue-710)]">
                            <i class="bi bi-image"></i>
                          </button>
                          <button data-testid="social-scan-submit" type="button" (click)="triggerScan()" [disabled]="homeMenuSearchTerm().trim().length === 0" [ngClass]="homeMenuSearchTerm().trim() ? '[.dark-theme_&&]:!bg-[var(--color-blue-640)] [.dark-theme_&&]:hover:!bg-[var(--color-blue-640)] [.dark-theme_&&]:active:!bg-[var(--color-blue-640)] [.light-theme_&&]:!bg-[var(--color-blue-640)] [.light-theme_&&]:hover:!bg-[var(--color-blue-630)] [.light-theme_&&]:active:!bg-[var(--color-blue-630)]' : ''" class="ui-graph-toolbar-search-btn ml-1 flex h-8 items-center rounded-full bg-[var(--color-blue-640)] px-4 text-sm font-semibold text-white transition-colors hover:bg-[var(--color-blue-630)] disabled:cursor-not-allowed disabled:bg-[var(--color-blue-710)] disabled:text-[var(--color-text4)] [.dark-theme_&]:!bg-slate-600 [.dark-theme_&]:hover:!bg-slate-700 [.dark-theme_&]:disabled:hover:!text-white [.light-theme_&]:!bg-[var(--color-blue-640)] [.light-theme_&]:hover:!bg-[var(--color-blue-630)] [.light-theme_&]:disabled:!bg-[#d9e3ef] [.light-theme_&]:disabled:hover:!bg-[#d9e3ef] [.light-theme_&]:disabled:!text-[#7d90a6] [.light-theme_&]:disabled:hover:!text-[#7d90a6]">
                            {{ 'Search' | translate }}
                          </button>
                        </div>
                      </div>
                      @if (hasResultSourceTabs()) {
                        <div data-testid="social-result-source-tabs" class="relative inline-flex h-10 shrink-0 items-center overflow-hidden rounded-full border-2 border-white/[0.09] bg-[var(--color-blue-820-light)] px-[3px] shadow-[0_8px_18px_var(--color-shadow-light)] [body.light-theme_&]:border-[#c8d9ea]">
                          <span aria-hidden="true" class="pointer-events-none absolute left-[3px] top-1/2 h-8 w-[calc((100%-6px)/2)] -translate-y-1/2 rounded-full bg-[var(--color-blue-640)] opacity-95 transition-[transform,opacity] duration-[120ms] ease-out" [class.translate-x-full]="activeResultSource() === 'darkweb'"></span>
                          <button type="button" (click)="setResultSource('normal')" [disabled]="getResultSourceCount('normal') === 0" [ngClass]="activeResultSource() === 'normal' ? 'text-white' : 'text-[var(--color-text3)]'" class="relative z-10 inline-flex h-8 min-w-[86px] items-center justify-center gap-2 rounded-full px-3 text-xs font-semibold transition-colors disabled:cursor-not-allowed disabled:opacity-45">
                            {{ 'Normal' | translate }}
                          </button>
                          <button type="button" (click)="setResultSource('darkweb')" [ngClass]="activeResultSource() === 'darkweb' ? 'text-white' : 'text-[var(--color-text3)]'" class="relative z-10 inline-flex h-8 min-w-[86px] items-center justify-center gap-2 rounded-full px-3 text-xs font-semibold transition-colors duration-150 disabled:cursor-not-allowed disabled:opacity-45">
                            {{ 'Darkweb' | translate }}
                          </button>
                        </div>
                      }
                      <button data-testid="social-manage-profiles-open" type="button" (click)="openNewProfilePage()" [title]="'Manage Profiles' | translate" [attr.aria-label]="'Manage Profiles' | translate" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border-0 bg-[var(--color-blue-800)]/90 text-[var(--color-text2)] shadow-lg ring-1 ring-inset ring-[var(--color-border)] backdrop-blur-sm transition-colors hover:text-[var(--color-blue-640)] [.dark-theme_&]:!bg-[rgba(51,65,85,0.6)] [.light-theme_&]:!bg-[rgba(255,255,255,0.94)]">
                        <i class="bi bi-gear text-base" aria-hidden="true"></i>
                      </button>
                      <button data-testid="social-result-source-graph" type="button" (click)="toggleGraphView()" [attr.aria-pressed]="graphView()" [title]="(graphView() ? 'Back to profiles' : 'Relationship graph') | translate" [attr.aria-label]="'Relationship graph' | translate" [ngClass]="graphView() ? '!bg-[var(--color-blue-640)] !text-white' : ''" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border-0 bg-[var(--color-blue-800)]/90 text-[var(--color-text2)] shadow-lg ring-1 ring-inset ring-[var(--color-border)] backdrop-blur-sm transition-colors hover:text-[var(--color-blue-640)] [.dark-theme_&]:!bg-[rgba(51,65,85,0.6)] [.light-theme_&]:!bg-[rgba(255,255,255,0.94)]">
                        <i class="bi bi-diagram-3 text-base" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                </div>
                @if (graphView()) {
                  <app-social-user-graph class="flex min-h-0 flex-1 flex-col" [usernames]="graphUsernames()" [loading]="isInitialLoading()" (usernamesChange)="onGraphUsernamesChange($event)"></app-social-user-graph>
                }
                @else {
                  <app-social-profile-listing
                    class="block min-h-0 flex-1"
                    [activeResultSources]="activeResultSources()"
                    [isInitialLoading]="isInitialLoading()"
                    [highlightedNodeId]="highlightedNodeId()"
                    (sidebarPlatformClicked)="onSidebarPlatformClicked($event)"
                    (manageProfilesRequested)="openManageProfiles($event)"
                    (profileOverviewLabelChanged)="onProfileOverviewLabelChanged($event)"
                    (scanInProgress)="showScanInProgressNotification()">
                  </app-social-profile-listing>
                }
              </div>
            </main>
          </div>

          @if (notification()) {
            <app-notification-bar [data]="notification()"></app-notification-bar>
          }
        </div>
    </main>

    @if (deleteConfirmationMessage(); as message) {
      <app-confirmation-popup [message]="message" (confirmed)="onDeleteConfirmation($event)"></app-confirmation-popup>
    }
    @if (manageProfilesModalData(); as data) {
      <app-manage-profiles-modal
        [data]="data"
        (close)="closeManageProfilesModal()"
        (updateGraph)="updateProfilesFromModal($event)"
        (searchUsername)="handleImageFlowSearch($event)">
      </app-manage-profiles-modal>
    }
</div>
