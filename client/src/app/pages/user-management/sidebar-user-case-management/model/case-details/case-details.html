<div class="w-full max-w-[2400px] p-0 sm:p-5">
    @if (isLoading) {
    <app-case-details-skeleton></app-case-details-skeleton>
    } @else if (caseData) {

    <div class="rounded-xl border border-[var(--color-border)] bg-[var(--color-consolidated-primary)] [body.light-theme_&]:border-[#d7e2ef] [body.light-theme_&]:bg-[#f9fbff] [body.light-theme_&]:shadow-none p-3 sm:p-5" data-testid="case-details-page" [@.disabled]="caseMotionDisabled">
        <app-case-header-actions></app-case-header-actions>

        <div class="my-5 hidden h-px w-full bg-[var(--color-divider)] md:block"></div>

        @if (pendingShareAction) {
        <app-confirmation-popup [message]="getShareConfirmationMessage()"
            (confirmed)="handleShareConfirmation($event)"></app-confirmation-popup>
        }

        @if (isArchiveConfirmationOpen) {
        <app-confirmation-popup data-testid="case-details-archive-confirmation"
            [message]="('Are you sure you want to archive this case?') | translate" (confirmed)="archiveCase($event)">
        </app-confirmation-popup>
        }

        @if (isUnarchiveConfirmationOpen) {
        <app-confirmation-popup data-testid="case-details-unarchive-confirmation"
            [message]="('Are you sure you want to unarchive this case?') | translate" (confirmed)="unarchiveCase($event)">
        </app-confirmation-popup>
        }

        <div class="space-y-5">
            <app-case-closure-section @caseSectionMotion></app-case-closure-section>
            <app-case-summary-section @caseSectionMotion></app-case-summary-section>
            <app-case-primary-entity-section @caseSectionMotion></app-case-primary-entity-section>
            <app-case-related-entities-section @caseSectionMotion></app-case-related-entities-section>

            <div @caseSectionMotion class="space-y-5">
                <app-case-artifacts-section></app-case-artifacts-section>
                <app-case-tasks-section></app-case-tasks-section>
            </div>

            <app-case-communications-section @caseSectionMotion></app-case-communications-section>
            <app-case-linked-cases-section @caseSectionMotion></app-case-linked-cases-section>
            <app-case-comments-section @caseSectionMotion></app-case-comments-section>
        </div>
    </div>

    } @else {
    <div class="rounded-xl border border-[var(--color-border)] bg-[var(--color-consolidated-primary)] [body.light-theme_&]:border-[#d7e2ef] [body.light-theme_&]:bg-[#f9fbff] [body.light-theme_&]:shadow-none flex min-h-[70vh] items-center justify-center p-5">
        <p class="text-[var(--color-text4)]">{{ 'Case not found' | translate }}</p>
    </div>
    }
    @if (appService.getConfig().appSettings.ai_endpoint_enabled && caseData) {
    <app-chat-widget [reportText]="getCaseDetailsJson()" tool="summarizer"></app-chat-widget>
    }
</div>
