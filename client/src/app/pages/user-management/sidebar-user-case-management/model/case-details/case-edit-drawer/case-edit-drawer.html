<div class="fixed inset-0 z-[1500]">
    <div class="absolute inset-0 bg-black/50 transition-opacity duration-300 [body.light-theme_&]:bg-[rgba(23,34,53,0.18)]" [ngClass]="isOpen ? 'opacity-100' : 'pointer-events-none opacity-0'" (click)="requestCancel()"></div>
    <div class="absolute right-0 top-0 flex h-full w-full max-w-2xl transform-gpu flex-col overflow-y-auto border-l border-[var(--color-border)] bg-[var(--color-blue-830)] shadow-[-18px_0_40px_rgba(0,0,0,0.34)] transition-transform duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] [body.light-theme_&]:bg-white [body.light-theme_&]:shadow-none" [ngClass]="isOpen ? 'translate-x-0' : 'translate-x-[102%]'" [attr.data-testid]="drawerTestId || null">
        <div class="border-b border-[var(--color-border)] bg-[var(--color-blue-830)]/95 px-6 py-3 backdrop-blur">
            <div class="min-w-0">
                <h2 class="text-[16px] font-semibold leading-tight text-[var(--color-text1)]">{{ title }}</h2>
                @if (subtitle) {
                <p class="mt-1 text-[11px] font-medium text-[var(--color-text4)]">{{ subtitle }}</p>
                }
            </div>
        </div>

        <ng-content></ng-content>

        <div class="sticky bottom-0 mt-auto flex justify-end gap-3 border-t border-[var(--color-border)] bg-[var(--color-blue-830)]/95 px-6 py-4 backdrop-blur">
            <button type="button" (click)="requestCancel()" [attr.data-testid]="cancelTestId || null" class="inline-flex items-center justify-center border text-sm font-semibold leading-none [height:var(--ui-btn-height,36px)] [padding:var(--ui-btn-py,0)_var(--ui-btn-px,16px)] [border-radius:var(--ui-btn-radius,10px)] [transition-property:var(--ui-btn-transition-properties,background-color,border-color,color)] [transition-duration:var(--ui-btn-transition-duration,160ms)] [transition-timing-function:ease] focus-visible:outline-none focus-visible:shadow-[0_0_0_2px_rgb(87_165_235/30%)] border-[var(--color-border)] text-[var(--color-text1)]">
                {{ 'common.actions.cancel' | translate }}
            </button>
            <button type="button" (click)="save.emit()" [attr.data-testid]="saveTestId || null" class="inline-flex appearance-none items-center justify-center border-0 text-sm font-semibold leading-none [height:var(--ui-btn-height,36px)] [padding:var(--ui-btn-py,0)_var(--ui-btn-px,16px)] [border-radius:var(--ui-btn-radius,10px)] [transition-property:var(--ui-btn-transition-properties,background-color,border-color,color)] [transition-duration:var(--ui-btn-transition-duration,160ms)] [transition-timing-function:ease] focus-visible:outline-none focus-visible:shadow-[0_0_0_2px_rgb(87_165_235/30%)] bg-[linear-gradient(92.32deg,#4ea2f1_2.58%,#2c7ac5)] text-white hover:bg-[linear-gradient(92.32deg,#3f96e8_2.58%,#236eb7)]">
                {{ saveLabel }}
            </button>
        </div>
    </div>
</div>
