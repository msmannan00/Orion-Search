<div class="w-full p-5">
  <div class="rounded-xl border border-[var(--color-border)] bg-[var(--color-consolidated-primary)] [body.light-theme_&]:border-[#d7e2ef] [body.light-theme_&]:bg-[#f9fbff] [body.light-theme_&]:shadow-none p-5" data-testid="case-tracking-board-settings-page">
    <div class="mb-5 flex flex-wrap items-center justify-between gap-4">
      <div class="min-w-0">
        <h1 class="text-[20px] font-semibold leading-[1.2] text-[var(--color-text1)]">{{ 'Status Tracking Board Settings' | translate }}</h1>
        <p class="mt-1 text-[12px] font-normal text-[var(--color-text6)]">{{ scopeLabel | translate }}</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button type="button" class="inline-flex items-center justify-center border text-sm font-semibold leading-none [height:var(--ui-btn-height,36px)] [padding:var(--ui-btn-py,0)_var(--ui-btn-px,16px)] [border-radius:var(--ui-btn-radius,10px)] [transition-property:var(--ui-btn-transition-properties,background-color,border-color,color)] [transition-duration:var(--ui-btn-transition-duration,160ms)] [transition-timing-function:ease] focus-visible:outline-none focus-visible:shadow-[0_0_0_2px_rgb(87_165_235/30%)] border-[var(--color-border)] bg-[var(--color-blue-820)] text-[var(--color-text2)] hover:bg-[var(--color-blue-810)] [--ui-btn-height:40px] gap-2" (click)="goBack()">
          <i class="bi bi-arrow-left text-sm"></i>
          {{ 'Back' | translate }}
        </button>
        <button type="button" class="inline-flex appearance-none items-center justify-center border-0 text-sm font-semibold leading-none [height:var(--ui-btn-height,36px)] [padding:var(--ui-btn-py,0)_var(--ui-btn-px,16px)] [border-radius:var(--ui-btn-radius,10px)] [transition-property:var(--ui-btn-transition-properties,background-color,border-color,color)] [transition-duration:var(--ui-btn-transition-duration,160ms)] [transition-timing-function:ease] focus-visible:outline-none focus-visible:shadow-[0_0_0_2px_rgb(87_165_235/30%)] bg-[linear-gradient(92.32deg,#4ea2f1_2.58%,#2c7ac5)] text-white hover:bg-[linear-gradient(92.32deg,#3f96e8_2.58%,#236eb7)] [--ui-btn-height:40px] gap-2 [body.light-theme_&]:disabled:cursor-not-allowed [body.light-theme_&]:disabled:!border-[#c8d6e8] [body.light-theme_&]:disabled:!bg-[#c8d6e8] [body.light-theme_&]:disabled:!text-[#667085]" [disabled]="isSaving || isLoading" (click)="save()">
          <i class="bi bi-check2 text-sm"></i>
          {{ (isSaving ? 'Saving' : 'Save') | translate }}
        </button>
      </div>
    </div>

    @if (errorText) {
    <div class="mb-4 rounded-[8px] border border-rose-400/30 bg-rose-400/10 px-3 py-2 text-sm text-rose-300 [body.light-theme_&]:border-red-600/30 [body.light-theme_&]:bg-red-100 [body.light-theme_&]:text-red-800">
      {{ errorText }}
    </div>
    }

    @if (isLoading) {
    <div class="grid min-h-[360px] place-items-center rounded-[10px] border border-dashed border-[var(--tenant-line)] bg-[var(--color-blue-820-light)]/60">
      <span class="h-6 w-6 animate-spin rounded-full border-2 border-[var(--tenant-line)] border-t-sky-400"></span>
    </div>
    } @else {
    <div class="space-y-3">
      @for (status of config.statuses; track status.value; let i = $index) {
      <div class="rounded-[10px] border border-[var(--tenant-line)] bg-[var(--color-blue-830)] p-4 shadow-[0_8px_18px_var(--color-shadow-light)]" [attr.data-testid]="'status-board-setting-' + status.value">
        <div class="grid grid-cols-1 gap-3 lg:grid-cols-[auto_1fr_auto_auto_auto_auto] lg:items-center">
          <div class="flex items-center gap-2 text-[var(--color-text4)]">
            <span class="flex h-8 w-8 items-center justify-center text-white [body.light-theme_&]:text-[var(--color-text3)]"> {{ i + 1 }} </span>
            <span class="rounded-[6px] bg-[var(--tenant-chip-bg)] px-2 py-1 text-xs font-semibold">{{ status.value }}</span>
          </div>

          <input class="h-10 rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 text-sm font-medium text-[var(--color-text1)] outline-none focus:border-sky-400/35 focus:ring-2 focus:ring-sky-400/20" [attr.data-testid]="'status-board-label-' + status.value" [(ngModel)]="status.label" (ngModelChange)="errorText = validate()" />

          <label class="inline-flex items-center gap-3 text-sm font-semibold text-[var(--color-text3)]">
            <span class="relative h-6 w-11 shrink-0">
              <input type="checkbox" class="peer sr-only" [attr.data-testid]="'status-board-enabled-' + status.value" [(ngModel)]="status.enabled" [disabled]="isRequiredStatus(status)" />
              <span class="absolute inset-0 cursor-pointer rounded-[20px] bg-[var(--color-button-secondary)] transition-colors duration-300 peer-checked:bg-[var(--color-button-primary)] peer-disabled:cursor-not-allowed peer-disabled:opacity-50 before:absolute before:bottom-[3px] before:left-[3px] before:h-[18px] before:w-[18px] before:rounded-full before:bg-white before:transition-transform before:duration-300 before:content-[''] peer-checked:before:translate-x-[20px]"></span>
            </span>
            <span>{{ 'Enabled' | translate }}</span>
          </label>
            <label class="inline-flex items-center gap-3 text-sm font-semibold text-[var(--color-text3)]">
              <span class="relative h-6 w-11 shrink-0">
                <input type="checkbox" class="peer sr-only" [attr.data-testid]="'status-board-skippable-' + status.value" [(ngModel)]="status.skippable" [disabled]="status.value === 'new' || status.value === 'closed'" />
                <span class="absolute inset-0 cursor-pointer rounded-full bg-[var(--color-button-secondary)] transition-colors duration-300 peer-checked:bg-[var(--color-button-primary)] peer-disabled:cursor-not-allowed peer-disabled:opacity-50 before:absolute before:bottom-[3px] before:left-[3px] before:h-[18px] before:w-[18px] before:rounded-full before:bg-white before:transition-transform before:duration-300 before:content-[''] peer-checked:before:translate-x-[20px]"></span>
              </span>
              <span>{{ 'Skippable' | translate }}</span>
            </label>
        </div>
      </div>
      }
    </div>
    }
  </div>
</div>
