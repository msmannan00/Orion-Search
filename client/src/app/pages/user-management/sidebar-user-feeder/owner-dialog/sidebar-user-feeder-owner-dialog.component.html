<div class="[&&]:!z-[9999] [&&]:!bg-[rgba(2,6,23,0.64)] backdrop-blur-[4px] overflow-y-auto [animation:uiModalOverlayFade_200ms_ease-out_both] [&.items-center]:[align-items:safe_center] fixed inset-0 z-50 flex items-center justify-center p-4 [body.light-theme_&&]:!bg-[rgba(23,34,53,0.18)]" (click)="closed.emit()">
  <div data-testid="feeder-owner-dialog" class="ui-graph-popup-panel [&&]:!border-[#2c3a4a] [&&]:!bg-[#1b2a3b] [&&]:!text-[#e1e8f0] [&&]:!shadow-[0_12px_40px_rgba(0,0,0,0.40)] origin-top [animation:slideUp_0.2s_ease-out_both] [body.light-theme_&&]:!border-[#d2deec] [body.light-theme_&&]:!bg-[#f7fbff] [body.light-theme_&&]:!text-[#172235] [body.light-theme_&&]:!shadow-[0_10px_28px_rgba(15,23,42,0.14)] ui-popup-shell [&&]:!border w-full max-w-[620px] rounded-xl p-6" (click)="$event.stopPropagation()">
    <div class="!text-[var(--color-text1)] text-lg font-semibold">{{ 'Change Script Owner' | translate }}</div>
    <div class="!text-[var(--color-text4)] mt-1 text-sm">
      {{ 'Reassign' | translate }}
      <span class="font-semibold text-[var(--color-text1)]">{{ script?.file_name }}</span>.
    </div>
    <div class="mt-2 text-xs text-[var(--color-text4)]">
      {{ 'Admin-only action. Only active feeder users are available.' | translate }}
    </div>

    @if (isOwnerLoading) {
      <div class="mt-4">
        <div class="ui-shimmer relative isolate box-border max-w-full overflow-hidden [--ui-shimmer-base:rgb(255_255_255/6%)] [--ui-shimmer-edge:rgb(255_255_255/2%)] [--ui-shimmer-slide-highlight:rgb(255_255_255/16%)] [&&]:!bg-[linear-gradient(180deg,var(--ui-shimmer-base),var(--ui-shimmer-base))] before:pointer-events-none before:absolute before:inset-0 before:content-[''] before:bg-[linear-gradient(180deg,var(--ui-shimmer-edge),transparent)] after:pointer-events-none after:absolute after:inset-0 after:content-[''] after:bg-[linear-gradient(110deg,transparent_20%,var(--ui-shimmer-slide-highlight)_48%,transparent_76%)] after:[animation:ui-shimmer-slide_1.55s_linear_infinite] [.light-theme_&]:[--ui-shimmer-base:#cfdceb] [.light-theme_&]:[--ui-shimmer-edge:rgb(255_255_255/42%)] [.light-theme_&]:[--ui-shimmer-slide-highlight:rgb(255_255_255/88%)] [.dark-theme_&]:[--ui-shimmer-base:rgb(255_255_255/9%)] [.dark-theme_&]:[--ui-shimmer-edge:rgb(255_255_255/4.5%)] [.dark-theme_&]:[--ui-shimmer-slide-highlight:rgb(255_255_255/20%)] h-[42px] w-full rounded-[10px] bg-[var(--color-divider)]"></div>
        <div class="ui-shimmer relative isolate box-border max-w-full overflow-hidden [--ui-shimmer-base:rgb(255_255_255/6%)] [--ui-shimmer-edge:rgb(255_255_255/2%)] [--ui-shimmer-slide-highlight:rgb(255_255_255/16%)] [&&]:!bg-[linear-gradient(180deg,var(--ui-shimmer-base),var(--ui-shimmer-base))] before:pointer-events-none before:absolute before:inset-0 before:content-[''] before:bg-[linear-gradient(180deg,var(--ui-shimmer-edge),transparent)] after:pointer-events-none after:absolute after:inset-0 after:content-[''] after:bg-[linear-gradient(110deg,transparent_20%,var(--ui-shimmer-slide-highlight)_48%,transparent_76%)] after:[animation:ui-shimmer-slide_1.55s_linear_infinite] [.light-theme_&]:[--ui-shimmer-base:#cfdceb] [.light-theme_&]:[--ui-shimmer-edge:rgb(255_255_255/42%)] [.light-theme_&]:[--ui-shimmer-slide-highlight:rgb(255_255_255/88%)] [.dark-theme_&]:[--ui-shimmer-base:rgb(255_255_255/9%)] [.dark-theme_&]:[--ui-shimmer-edge:rgb(255_255_255/4.5%)] [.dark-theme_&]:[--ui-shimmer-slide-highlight:rgb(255_255_255/20%)] mt-3 h-[42px] w-[140px] rounded-[10px] bg-[var(--color-divider)]"></div>
      </div>
    } @else {
      <div class="mt-4">
        <label class="!text-[var(--color-text2)] mb-1.5 block text-sm font-medium">{{ 'Feeder User' | translate }}</label>
        <select data-testid="feeder-owner-select" [(ngModel)]="selectedOwnerUserId" class="ui-popup-select [&&]:!border-[#2c3a4a] [&&]:!bg-[#152230] [&&]:!text-[#e1e8f0] [&&]:!shadow-none placeholder:[&&]:!text-[#5a6e84] focus:[&&&]:!border-[#57a5eb] focus:[&&&]:!bg-[#1a2835] focus:[&&&]:!shadow-[0_0_0_2px_rgb(87_165_235/22%)] focus:[&&&]:!outline-none [.light-theme_&&]:!border-[#c7d5e6] [.light-theme_&&]:!bg-white [.light-theme_&&]:!text-[#172235] [.light-theme_&&]:placeholder:!text-[#94a3b8] [.light-theme_&&]:focus:!border-[#c7d5e6] [.light-theme_&&]:focus:!bg-white appearance-none !pr-11 [background-image:var(--filter-dropdown-icon)] bg-no-repeat [background-position:right_1rem_center] [background-size:11px_11px] [&::-ms-expand]:hidden w-full rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 py-2.5 text-sm text-[var(--color-text1)] outline-none [body.light-theme_&]:bg-white">
          <option value="">{{ 'Select feeder user' | translate }}</option>
          @for (user of getAvailableOwnerUsers(); track user.id) {
            <option [attr.data-testid]="'feeder-owner-option-' + user.username" [value]="user.id">{{ user.username }}{{ user.email ? ' (' + user.email + ')' : '' }}</option>
          }
        </select>
      </div>
    }

    <div class="[&&]:!border-t [&&]:!border-t-[var(--color-border)] mt-5 flex items-center justify-end gap-2">
      <button data-testid="feeder-owner-cancel" type="button" class="ui-popup-btn-secondary border [&&]:!border-[#4a5f77] [&&]:!bg-transparent [&&]:!text-[#e1e8f0] [&&]:!px-[14px] [&&]:!py-[6px] [&&]:!h-auto [&&]:!min-w-0 [border-radius:var(--ui-popup-button-radius,6px)] [font-size:var(--ui-popup-button-font-size,13px)] [font-weight:var(--ui-popup-button-font-weight,500)] [transition-property:var(--ui-popup-button-transition,background-color,border-color)] [transition-duration:var(--ui-popup-button-duration,180ms)] [transition-timing-function:ease] hover:[&&&]:!border-[#5a7594] hover:[&&&]:!bg-[rgb(74_95_119/10%)] [--ui-popup-button-font-size:14px] [--ui-popup-button-font-weight:600] [.light-theme_&&]:!border-[#c7d5e6] [.light-theme_&&]:!bg-transparent [.light-theme_&&]:!text-[#1f2e47] [.light-theme_&&]:hover:!border-[#aac0da] [.light-theme_&&]:hover:!bg-[#eef5ff]" (click)="closed.emit()">{{ 'common.actions.cancel' | translate }}</button>
      <button data-testid="feeder-owner-submit" type="button" class="ui-popup-btn-primary [&&]:!border-0 [&&]:!bg-[linear-gradient(135deg,#57a5eb_0%,#0ea5e9_100%)] [&&]:!text-white [&&]:!shadow-[0_1px_4px_rgb(87_165_235/25%)] [&&]:!px-[14px] [&&]:!py-[6px] [&&]:!h-auto [&&]:!min-w-0 [border-radius:var(--ui-popup-button-radius,6px)] [font-size:var(--ui-popup-button-font-size,13px)] [font-weight:var(--ui-popup-button-font-weight,500)] [transition-property:var(--ui-popup-button-transition,background-color,transform,box-shadow)] [transition-duration:var(--ui-popup-button-duration,180ms)] [transition-timing-function:ease] hover:[&&&]:!bg-[linear-gradient(135deg,#6bb5ff_0%,#1eb5f9_100%)] hover:[&&&]:!-translate-y-px hover:[&&&]:!shadow-[0_2px_6px_rgb(87_165_235/30%)] active:[&&&]:!translate-y-0 [--ui-popup-button-font-size:14px] [--ui-popup-button-font-weight:600] disabled:cursor-not-allowed disabled:opacity-60" [disabled]="isOwnerLoading || isOwnerSaving || !selectedOwnerUserId" (click)="confirmOwnerTransfer()">
        {{ (isOwnerSaving ? 'Updating...' : 'Change Owner') | translate }}
      </button>
    </div>
  </div>
</div>
