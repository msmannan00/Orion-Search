<div class="absolute inset-0 z-[20] grid place-items-center backdrop-blur-[8px] ui-scan-overlay-in" [ngClass]="isLightTheme ? 'bg-[rgba(226,235,246,0.5)]' : 'bg-[#020617C7]'" role="dialog" aria-modal="true">
  <div class="mt-[-200px] w-[calc(100%-32px)] max-w-[520px] rounded-[16px] border p-[22px_22px_18px] text-center ui-scan-card-in" [ngClass]="isLightTheme ? 'border-[#c5d3e4] bg-white text-[#172235] shadow-[0_18px_44px_rgba(15,23,42,0.16)]' : 'border-[rgba(148,163,184,0.18)] bg-[rgba(15,23,42,0.92)] text-[#f8fafc] shadow-[0_24px_70px_rgba(0,0,0,0.55)]'">
    <div class="mb-[8px] flex items-center justify-center gap-[12px]">
      <div class="h-[38px] w-[38px] animate-spin rounded-full border-[3px] border-t-[var(--color-blue-640)]" [ngClass]="isLightTheme ? 'border-[rgba(23,35,53,0.2)]' : 'border-[rgba(248,250,252,0.18)]'"></div>
      <div class="text-[16px] font-extrabold">{{ 'Scanning data' | translate }}</div>
    </div>

    <div class="mb-[14px] text-[13px]" [ngClass]="isLightTheme ? 'text-[#667085]' : 'text-[rgba(248,250,252,0.82)]'">{{ 'This may take a moment. Please keep this tab open.' | translate }}</div>

    <div class="relative mb-[14px] h-[10px] overflow-hidden rounded-[999px] border" [ngClass]="isLightTheme ? 'border-[#d4deeb] bg-[#eaf1fb]' : 'border-[rgba(148,163,184,0.18)] bg-[rgba(148,163,184,0.16)]'">
      <span class="absolute left-[-40%] h-full w-[40%] rounded-[999px] bg-[linear-gradient(90deg,rgba(87,165,235,0.25),rgba(87,165,235,0.95),rgba(87,165,235,0.25))] animate-[indeterminate_1.2s_ease-in-out_infinite]"></span>
    </div>

    @if (this.licenseService.getLicenses().includes('maintainer')) {
      <div class="flex justify-center">
        <button data-testid="tenant-scan-cancel" type="button" class="h-[42px] rounded-full !border !border-[rgba(148,163,184,0.35)] !bg-[rgba(79,100,121,0.12)] px-[16px] py-[9px] text-[13px] font-extrabold !text-[var(--color-text1)] transition-[background-color,border-color,transform,box-shadow] duration-150 ease-out hover:-translate-y-[1px] hover:!border-[rgba(148,163,184,0.55)] hover:!bg-[rgba(79,100,121,0.20)] hover:shadow-[0_8px_20px_rgba(0,0,0,0.20)] active:translate-y-0 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-blue-640)] focus-visible:ring-offset-2 [body.light-theme_&]:!border-[#c9d8e8] [body.light-theme_&]:!bg-white [body.light-theme_&]:!text-[#1f2e47] [body.light-theme_&]:hover:!border-[#7f9ab8] [body.light-theme_&]:hover:!bg-[#f8fbff]" (click)="cancelScan()">
          {{ 'common.actions.cancel' | translate }}
        </button>
      </div>
    } @else {
      <div class="h-[10px]"></div>
    }
  </div>
</div>
