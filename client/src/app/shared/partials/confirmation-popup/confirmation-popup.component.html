<div class="[&&]:!z-[9999] [&&]:!bg-[rgba(2,6,23,0.64)] [body.light-theme_&&]:!bg-[rgba(15,23,42,0.24)] backdrop-blur-[4px] overflow-y-auto [animation:uiModalOverlayFade_200ms_ease-out_both] [&.items-center]:[align-items:safe_center] fixed inset-0 z-50 flex items-center justify-center p-4" @popupAnimation data-role="backdrop" (click)="onBackdrop($event)">
  <div data-testid="confirmation-popup" class="ui-graph-popup-panel [&&]:!border-[#2c3a4a] [&&]:!bg-[#1b2a3b] [&&]:!text-[#e1e8f0] [&&]:!shadow-[0_12px_40px_rgba(0,0,0,0.40)] origin-top [animation:slideUp_0.2s_ease-out_both] [body.light-theme_&&]:!border-[#d2deec] [body.light-theme_&&]:!bg-[#f7fbff] [body.light-theme_&&]:!text-[#172235] [body.light-theme_&&]:!shadow-[0_10px_28px_rgba(15,23,42,0.14)] ui-popup-shell [&&]:!border w-full max-w-[420px] rounded-xl p-6" [ngClass]="warning() ? ['[&&&]:!border-0', '[&&&]:!bg-[linear-gradient(145deg,rgba(249,115,22,0.14)_0%,#1b2a3b_48%)]', '[&&&]:!shadow-[0_14px_42px_rgba(0,0,0,0.4),0_0_0_1px_rgba(249,115,22,0.08)]', '[body.light-theme_&&&]:!bg-[linear-gradient(145deg,rgba(249,115,22,0.1)_0%,#fff7ed_48%)]', '[body.light-theme_&&&]:!text-[#172235]', '[body.light-theme_&&&]:!shadow-[0_10px_28px_rgba(154,52,18,0.12)]'] : []">
    @if (warning()) {
      <div class="!text-[var(--color-text1)] flex items-center gap-2 text-lg font-semibold [&&]:!text-orange-400 [body.light-theme_&&]:!text-orange-700">
        <i data-testid="confirmation-warning-icon" class="bi bi-exclamation-triangle-fill text-[17px]" aria-hidden="true"></i>
        <span>{{ 'confirmation.title' | translate }}</span>
      </div>
    } @else {
      <div class="!text-[var(--color-text1)] text-lg font-semibold">{{ 'confirmation.title' | translate }}</div>
    }


    <div class="mt-3 break-words text-sm text-[var(--color-text3)]" [ngClass]="warning() ? (message().includes('\n') ? ['whitespace-pre-line'] : ['whitespace-normal']) : []">

      {{ message() | translate }}
    </div>

    <div class="mt-6 flex justify-end gap-2">
      <button triggerAutoFocus data-testid="confirmation-yes-button" class="ui-popup-btn-primary [&&]:!border-0 [&&]:!bg-[linear-gradient(135deg,#57a5eb_0%,#0ea5e9_100%)] [&&]:!text-white [&&]:!shadow-[0_1px_4px_rgb(87_165_235/25%)] [&&]:!px-[14px] [&&]:!py-[6px] [&&]:!h-auto [&&]:!min-w-0 [border-radius:var(--ui-popup-button-radius,6px)] [font-size:var(--ui-popup-button-font-size,13px)] [font-weight:var(--ui-popup-button-font-weight,500)] [transition-property:var(--ui-popup-button-transition,background-color,transform,box-shadow)] [transition-duration:var(--ui-popup-button-duration,180ms)] [transition-timing-function:ease] hover:[&&&]:!bg-[linear-gradient(135deg,#6bb5ff_0%,#1eb5f9_100%)] hover:[&&&]:!-translate-y-px hover:[&&&]:!shadow-[0_2px_6px_rgb(87_165_235/30%)] active:[&&&]:!translate-y-0 [--ui-popup-button-font-size:14px] [--ui-popup-button-font-weight:600]" [ngClass]="warning() ? ['[&&&]:!bg-[linear-gradient(135deg,#d97706_0%,#f97316_100%)]', '[&&&]:!shadow-[0_2px_8px_rgba(249,115,22,0.22)]', '[&&&&]:hover:!bg-[linear-gradient(135deg,#e58b0b_0%,#fb923c_100%)]', '[&&&&]:hover:!shadow-[0_3px_10px_rgba(249,115,22,0.28)]'] : []" (click)="onYes()">{{ confirmLabel() | translate }}</button>
      @if (showCancel()) {
        <button class="ui-popup-btn-secondary border [&&]:!border-[#4a5f77] [&&]:!bg-transparent [&&]:!text-[#e1e8f0] [&&]:!px-[14px] [&&]:!py-[6px] [&&]:!h-auto [&&]:!min-w-0 [border-radius:var(--ui-popup-button-radius,6px)] [font-size:var(--ui-popup-button-font-size,13px)] [font-weight:var(--ui-popup-button-font-weight,500)] [transition-property:var(--ui-popup-button-transition,background-color,border-color)] [transition-duration:var(--ui-popup-button-duration,180ms)] [transition-timing-function:ease] hover:[&&&]:!border-[#5a7594] hover:[&&&]:!bg-[rgb(74_95_119/10%)] [--ui-popup-button-font-size:14px] [--ui-popup-button-font-weight:600] [.light-theme_&&]:!border-[#c7d5e6] [.light-theme_&&]:!bg-transparent [.light-theme_&&]:!text-[#1f2e47] [.light-theme_&&]:hover:!border-[#aac0da] [.light-theme_&&]:hover:!bg-[#eef5ff]" (click)="onNo()">{{ 'common.actions.cancel' | translate }}</button>
      }
    </div>
  </div>
</div>
