@if (visible()) {
  <div [attr.data-testid]="overlayTestId()" class="[&&]:!z-[9999] [&&]:!bg-[rgba(2,6,23,0.64)] [body.light-theme_&&]:!bg-[rgba(15,23,42,0.24)] backdrop-blur-[4px] overflow-y-auto [animation:uiModalOverlayFade_200ms_ease-out_both] [&.items-center]:[align-items:safe_center] report-export-overlay export-choice-overlay fixed inset-0 z-[1200] flex items-center justify-center p-4" (click)="onOverlayClick($event)">
    <div [attr.data-testid]="modalTestId()" class="ui-graph-popup-panel [&&]:!border-[#2c3a4a] [&&]:!bg-[#1b2a3b] [&&]:!text-[#e1e8f0] [&&]:!shadow-[0_12px_40px_rgba(0,0,0,0.40)] origin-top [animation:slideUp_0.2s_ease-out_both] [body.light-theme_&&]:!border-[#d2deec] [body.light-theme_&&]:!bg-[#f7fbff] [body.light-theme_&&]:!text-[#172235] [body.light-theme_&&]:!shadow-[0_10px_28px_rgba(15,23,42,0.14)] ui-popup-shell [&&]:!border w-full max-w-lg rounded-xl p-4">
      <div class="mb-3 flex items-center justify-between">
        <h3 class="!text-[var(--color-text1)] text-base font-semibold">{{ title() | translate }}</h3>
        <button [attr.data-testid]="closeTestId()" type="button" class="ui-popup-close inline-flex items-center justify-center p-0 leading-none text-[#ccc] [width:var(--ui-popup-close-width,42px)] [height:var(--ui-popup-close-height,42px)] [border-radius:var(--ui-popup-close-radius,8px)] [font-size:var(--ui-popup-close-font-size,28px)] [transition-property:color,background-color] [transition-duration:var(--ui-popup-close-duration,180ms)] [transition-timing-function:ease] hover:[&&]:!bg-[var(--color-blue-700)] hover:[&&]:!text-[var(--color-blue-640)] [.light-theme_&]:!text-[#667085] [.light-theme_&]:hover:!bg-[#eef5ff] [.light-theme_&]:hover:!text-[#1f2e47] [--ui-popup-close-font-size:20px]" [attr.aria-label]="'common.actions.close' | translate" (click)="closed.emit(undefined)">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <p class="mb-4 text-sm" [ngClass]="isLightTheme() ? 'text-[#475467]' : 'text-slate-300'">{{ subtitle() | translate }}</p>
      <div class="grid gap-2">
        @for (option of options(); track option.value) {
          <button [attr.data-testid]="option.testId || null" type="button" class="w-full rounded-lg border px-3 py-3 text-left transition-colors" [ngClass]="isLightTheme() ? 'border-[var(--color-border)] bg-[rgba(0,0,0,0.02)] hover:border-[#aac0da] hover:bg-[#eef5ff]' : 'border-slate-600 bg-slate-700/60 hover:border-indigo-400 hover:bg-slate-700'" (click)="select(option.value)">
            <div class="text-sm font-semibold" [ngClass]="isLightTheme() ? 'text-[#172235]' : 'text-white'">{{ option.title | translate }}</div>
            @if (option.description) {
              <div class="text-xs" [ngClass]="isLightTheme() ? 'text-[#475467]' : 'text-slate-300'">{{ option.description | translate }}</div>
            }
          </button>
        }
      </div>
    </div>
  </div>
}
