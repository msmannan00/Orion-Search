services:
  web:
    container_name: trusted-web-main
    build:
      context: .
      dockerfile: dockerFiles/api_docker
    env_file:
      - .env
    environment:
      BLOOM_DIR: /app
      PYTHONPATH: /app
    working_dir: /app
    depends_on:
      - elasticsearch
      - mailpit
      - mongo
      - arangodb
    volumes:
      - ./backend/sitecustomize.py:/app/sitecustomize.py:ro
      - ./backend/orion:/app/orion:cached
      - ./backend/routes:/app/routes:cached
      - ./backend/static:/app/static:cached
      - ./backend/workspace:/app/workspace:cached
      - ./backend/tests:/app/tests:cached
      - ./backend/migrations:/app/migrations:cached
      - ./backend/build/backups:/app/backups:cached
      - ./client/build:/app/build:delegated
      - ./client/build:/app/workspace/build:delegated
    expose:
      - "8070"
    networks:
      - backend
      - shared_bridge
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:8070/api/public > /dev/null" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    command: >
      sh -c "exec gunicorn --preload -w 1 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:8070 --timeout 900"

  documentation:
    build:
      context: ./docs
      args:
        DOCUMENTATION_PROJECT_NAME: "${DOCUMENTATION_PROJECT_NAME:-Platform}"
        DOCUMENTATION_COMPANY_NAME: "${DOCUMENTATION_COMPANY_NAME:-Platform Operator}"
    expose:
      - "80"
    networks:
      - backend

  arangodb:
    container_name: trusted-web-arangodb
    image: arangodb:3.11
    restart: unless-stopped
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD}
      ARANGODB_DEFAULT_SERVER_ENDPOINT: tcp://0.0.0.0:8529
    ports:
      - "8529:8529"
    volumes:
      - arangodb_test:/var/lib/arangodb3
    networks:
      backend:
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8529/_admin/server/availability" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    container_name: trusted-web-nginx
    image: fholzer/nginx-brotli:latest
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      - web
      - documentation
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/workspace/ssl:/etc/nginx/local-certs:ro
      - ./backend/static:/app/static:cached
      - ./backend/workspace:/app/workspace:cached
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      backend:
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1:8443 >/dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - ENABLE_BROTLI=1

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=false
      - discovery.type=single-node
      - network.host=0.0.0.0
      - http.port=9400
      - ELASTIC_USERNAME=${ELASTIC_ROOT_USERNAME}
      - ELASTIC_PASSWORD=${ELASTIC_ROOT_PASSWORD}
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - indices.memory.index_buffer_size=5%
      - node.store.allow_mmap=false
      - ES_JAVA_OPTS=-Djdk.internal.platform.disableContainerSupport=true -Xms512m -Xmx512m
    env_file:
      - .env
    ports:
      - "9400:9400"
    volumes:
      - elastic_test:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -f http://localhost:9400/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      backend:
    deploy:
      resources:
        limits:
          memory: 5G

  redis_server:
    container_name: trusted-web-redis
    image: redis:7.4.0
    logging:
      driver: none
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    restart: always
    env_file:
      - .env
    volumes:
      - redis_test:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      backend:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  mailpit:
    container_name: trustly-web-mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_SMTP_AUTH_USERNAME: accounts@example.com
      MP_SMTP_AUTH_PASSWORD: test
    networks:
      - backend

  mongo:
    image: mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    container_name: trustly-web-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27020:27017"
    volumes:
      - mongo_test:/data/db
    command: >
      bash -c "
      mongod --bind_ip_all --fork --logpath /var/log/mongodb.log &&
      sleep 10 &&
      mongosh --eval '
        db = db.getSiblingDB(\"admin\");
        if (db.getUser(\"${MONGO_ROOT_USERNAME}\") === null) {
          db.createUser({
            user: \"${MONGO_ROOT_USERNAME}\",
            pwd: \"${MONGO_ROOT_PASSWORD}\",
            roles: [{ role: \"userAdminAnyDatabase\", db: \"admin\" }, { role: \"readWriteAnyDatabase\", db: \"admin\" }]
          });
        }
      ' &&
      mongod --shutdown &&
      sleep 5 &&
      exec mongod --auth --bind_ip_all
      "
    networks:
      backend:
    healthcheck:
      test: [ "CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/27017' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  shared_bridge:
    external: true
  backend:
    driver: bridge

volumes:
  redis_test:
  mongo_test:
  elastic_test:
  arangodb_test:
