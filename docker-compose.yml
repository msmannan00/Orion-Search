services:
  web:
    profiles:
      - local
    container_name: trusted-web-main
    build:
      context: .
      dockerfile: dockerFiles/api_docker
    env_file:
      - .env
    environment:
      BLOOM_DIR: /app
      PYTHONPATH: /app
      ELASTIC_ROOT_IP: elasticsearch
      ELASTIC_ROOT_USERNAME: elastic
    working_dir: /app
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis_server:
        condition: service_started
      mailpit:
        condition: service_started
      mongo:
        condition: service_started
      arangodb:
        condition: service_started
    volumes:
      - ./backend/sitecustomize.py:/app/sitecustomize.py:ro
      - ./backend/main.py:/app/main.py:cached
      - ./backend/interface.py:/app/interface.py:cached
      - ./backend/configs:/app/configs:cached
      - ./backend/orion:/app/orion:cached
      - ./backend/routes:/app/routes:cached
      - ./backend/static:/app/static:cached
      - ./backend/workspace:/app/workspace:cached
      - ./backend/tests:/app/tests:cached
      - ./backend/migrations:/app/migrations:cached
      - ./backend/build/backups:/app/backups:delegated
      - ./client/build:/app/build:delegated
      - ./client/build:/app/workspace/build:delegated
    expose:
      - "8070"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - shared_bridge
      - orion_nexus_backend
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:8070/api/public > /dev/null" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    command: >
      sh -c "python3 /app/cronjobs.py & exec uvicorn main:app --host 0.0.0.0 --port 8070 --reload --reload-dir /app/configs --reload-dir /app/orion --reload-dir /app/routes"

  web-dev:
    profiles:
      - dev
    container_name: trusted-web-main
    build:
      context: .
      dockerfile: dockerFiles/api_docker_dev
    env_file:
      - .env
    environment:
      BLOOM_DIR: /app
      PYTHONPATH: /app
      ELASTIC_ROOT_IP: elasticsearch
      ELASTIC_ROOT_USERNAME: elastic
    working_dir: /app
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis_server:
        condition: service_started
      mailpit:
        condition: service_started
      mongo:
        condition: service_started
      arangodb:
        condition: service_started
    volumes:
      - ./backend/sitecustomize.py:/app/sitecustomize.py:ro
      - ./backend/main.py:/app/main.py:cached
      - ./backend/interface.py:/app/interface.py:cached
      - ./backend/configs:/app/configs:cached
      - ./backend/orion:/app/orion:cached
      - ./backend/routes:/app/routes:cached
      - ./backend/static:/app/static:cached
      - ./backend/workspace:/app/workspace:cached
      - ./backend/tests:/app/tests:cached
      - ./backend/migrations:/app/migrations:cached
      - ./backend/build/backups:/app/backups:delegated
      - ./client/build:/app/build:delegated
      - ./client/src/assets/data:/app/build/assets/data:ro
      - ./client/build:/app/workspace/build:delegated
      - ./client/src/assets/data:/app/workspace/build/assets/data:ro
    expose:
      - "8070"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      backend:
        aliases:
          - web
      shared_bridge:
      orion_nexus_backend:
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:8070/api/public > /dev/null" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    command: >
      sh -c "python3 /app/cronjobs.py & exec uvicorn main:app --host 0.0.0.0 --port 8070 --reload --reload-dir /app/configs --reload-dir /app/orion --reload-dir /app/routes"

  documentation:
    profiles:
      - local
      - dev
    build:
      context: ./docs
      args:
        DOCUMENTATION_PROJECT_NAME: "${DOCUMENTATION_PROJECT_NAME:-Platform}"
        DOCUMENTATION_COMPANY_NAME: "${DOCUMENTATION_COMPANY_NAME:-Platform Operator}"
    expose:
      - "80"
    networks:
      - backend

  arangodb:
    container_name: trusted-web-arangodb
    image: arangodb:3.11
    restart: unless-stopped
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD}
      ARANGODB_DEFAULT_SERVER_ENDPOINT: tcp://0.0.0.0:8529
    ports:
      - "8529:8529"
    volumes:
      - arangodb:/var/lib/arangodb3
    networks:
      backend:
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8529/_admin/server/availability" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    profiles:
      - local
    container_name: trusted-web-nginx
    image: fholzer/nginx-brotli:latest
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      - web
      - documentation
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/workspace/ssl:/etc/nginx/local-certs:ro
      - ./backend/static:/app/static:cached
      - ./backend/workspace:/app/workspace:cached
      - ./client/build:/client_build:ro
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      backend:
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1:8443 >/dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - ENABLE_BROTLI=1

  nginx-dev:
    profiles:
      - dev
    container_name: trusted-web-nginx
    image: fholzer/nginx-brotli:latest
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      - web-dev
      - documentation
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./backend/workspace/ssl:/etc/nginx/local-certs:ro
      - ./backend/static:/app/static:cached
      - ./backend/workspace:/app/workspace:cached
      - ./client/build:/client_build:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      backend:
    healthcheck:
      test: [ "CMD-SHELL", "status=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/admin/backups/status || true); [ \"$$status\" = \"401\" ] || [ \"$$status\" = \"200\" ]" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    environment:
      - ENABLE_BROTLI=1

  elasticsearch:
    container_name: trusted-web-elastic
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_ROOT_PASSWORD:?ELASTIC_ROOT_PASSWORD must be set}
      cluster.routing.allocation.disk.threshold_enabled: "false"
      discovery.type: single-node
      network.host: 0.0.0.0
      http.port: "9400"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      indices.memory.index_buffer_size: 5%
      node.store.allow_mmap: "false"
      ES_JAVA_OPTS: -Djdk.internal.platform.disableContainerSupport=true -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9400:9400"
    volumes:
      - elastic:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent --user \"elastic:$${ELASTIC_PASSWORD}\" http://localhost:9400/_cluster/health > /dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      backend:
    deploy:
      resources:
        limits:
          memory: 5G

  redis_server:
    container_name: trusted-web-redis
    image: redis:7.4.0
    logging:
      driver: none
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    restart: always
    env_file:
      - .env
    volumes:
      - redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      backend:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  mailpit:
    container_name: trustly-web-mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_SMTP_AUTH_USERNAME: accounts@example.com
      MP_SMTP_AUTH_PASSWORD: test
    networks:
      - backend

  mongo:
    image: mongo:7.0
    container_name: trustly-web-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27020:27017"
    volumes:
      - mongo:/data/db
    command: >
      bash -c "
      mongod --bind_ip_all --fork --logpath /var/log/mongodb.log &&
      sleep 10 &&
      mongosh --eval '
        db = db.getSiblingDB(\"admin\");
        if (db.getUser(\"${MONGO_ROOT_USERNAME}\") === null) {
          db.createUser({
            user: \"${MONGO_ROOT_USERNAME}\",
            pwd: \"${MONGO_ROOT_PASSWORD}\",
            roles: [{ role: \"userAdminAnyDatabase\", db: \"admin\" }, { role: \"readWriteAnyDatabase\", db: \"admin\" }]
          });
        }
      ' &&
      mongod --shutdown &&
      sleep 5 &&
      exec mongod --auth --bind_ip_all
      "
    networks:
      backend:
    healthcheck:
      test: [ "CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/27017' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  orion_nexus_backend:
    external: true
  shared_bridge:
    external: true
  backend:
    driver: bridge

volumes:
  redis:
  mongo:
  elastic:
  arangodb:
