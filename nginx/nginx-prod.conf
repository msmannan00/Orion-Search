worker_processes auto;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    open_file_cache off;
    server_tokens off;
    server_names_hash_bucket_size 128;
    autoindex off;
    resolver 127.0.0.11 ipv6=off;
    resolver_timeout 10s;

    map $request_method $upstream_method {
        default $request_method;
        HEAD GET;
    }

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=60m use_temp_path=off;

    brotli on;
    brotli_comp_level 8;
    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        text/xml
        application/xml
        image/svg+xml
        application/x-javascript
        text/x-js;
    brotli_min_length 20;

    gzip on;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        text/xml
        application/xml
        image/svg+xml
        application/x-javascript
        text/x-js;
    gzip_min_length 20;
    gzip_vary on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Server "Secure Gateway" always;

    map $request_uri $bad_traversal {
        default 0;
        ~*"\.\./" 1;
        ~*"%2e%2e/" 1;
        ~*"\.%2e/" 1;
        ~*"%2e\./" 1;
        ~*"%2f\.\.%2f" 1;
        ~*"%5c\.\.%5c" 1;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    send_timeout 120s;
    client_body_buffer_size 8m;

    server {
        listen 80;
        server_name try.orionintelligence.org *.orionintelligence.org;
        client_max_body_size 32m;
        set $app_backend trusted-web-main:8070;

        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            try_files $uri =404;
        }

        location = /api/admin/backups/status {
            proxy_intercept_errors off;
            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/extension/socket {
            if (-f /app/static/.maintenance) { return 503; }
            proxy_intercept_errors off;
            proxy_pass http://$app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        client_max_body_size 32m;
        server_name mail.orionintelligence.org;
        set $mail_backend orion-mail-nginx:8080;

        ssl_certificate /etc/letsencrypt/live/try.orionintelligence.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/try.orionintelligence.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        resolver 127.0.0.11 ipv6=off valid=300s;
        resolver_timeout 10s;

        location / {
            proxy_pass http://$mail_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass_request_headers on;
            proxy_http_version 1.1;
        }
    }

    server {
        listen 443 ssl;
        client_max_body_size 32m;
        server_name try.orionintelligence.org *.orionintelligence.org;
        set $app_backend trusted-web-main:8070;

        if ($bad_traversal) { return 403; }

        ssl_certificate /etc/letsencrypt/live/try.orionintelligence.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/try.orionintelligence.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        # ssl_stapling on;
        # ssl_stapling_verify on;
        resolver 127.0.0.11 ipv6=off valid=300s;
        resolver_timeout 10s;

        error_page 404 /404.html;
        error_page 403 /403.html;
        error_page 405 500 /500.html;
        error_page 502 503 504 =503 /maintenance.html;

        location = /robots.txt {
            alias /app/static/robots.txt;
            add_header Cache-Control "public, max-age=1";
        }

        location ~ /\.(?!well-known/) {
            deny all;
        }

        location ^~ /api/s/static/system/ {
            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_intercept_errors off;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;

            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /api/s/static/favicon {
            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_intercept_errors off;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;

            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /api/public {
            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            proxy_set_header Cache-Control "no-cache";
            proxy_set_header Pragma "no-cache";
            proxy_pass_request_headers on;
            proxy_intercept_errors off;
            proxy_ignore_headers Cache-Control Expires Vary;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            proxy_hide_header Vary;
            proxy_hide_header Age;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_cache off;

            expires off;
            add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Surrogate-Control "no-store" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;
        }

        location = /api/insight {
            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_intercept_errors off;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;

            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /api/admin/backups/status {
            proxy_intercept_errors off;
            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/extension/socket {
            if (-f /app/static/.maintenance) { return 503; }
            proxy_intercept_errors off;
            proxy_pass http://$app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /ext/ {
            if (-f /app/static/.maintenance) { return 503; }

            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass_request_headers on;
            proxy_intercept_errors off;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /api/ {
            if (-f /app/static/.maintenance) { return 503; }

            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_intercept_errors off;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /admin/ {
            if (-f /app/static/.maintenance) { return 503; }

            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_intercept_errors on;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        location ~* ^/(?:runtime|polyfills|main|styles|common|[0-9]+)\.[^/]+\.(?:js|css|map)$ {
            root /client_build;
            try_files $uri =404;

            access_log off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location /assets/ {
            root /client_build;
            try_files $uri =404;

            access_log off;
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;
        }

        location = /documentation {
            absolute_redirect off;
            return 301 /documentation/;
        }

        location = /documentation/ {
            absolute_redirect off;
            return 302 /documentation/app_docs/user_manual.html;
        }

        location ^~ /documentation/ {
            proxy_pass http://documentation/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            if (-f /app/static/.maintenance) { return 503; }

            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_intercept_errors on;
            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;
            add_header Cache-Control "private, max-age=15, must-revalidate";
        }

        location = /static/test { return 404; }
        location ^~ /static/test/ { return 404; }

        # Parser archives must be downloaded through /api/parser, which is
        # restricted to crawler and administrator accounts by the API.
        location = /static/.well-known { return 404; }
        location ^~ /static/.well-known/ { return 404; }

        # Breach screenshots must be served by the authenticated, licensed
        # /api/search/breach/screenshot/{id} endpoint used by breach reports.
        location = /static/resource/screenshot { return 404; }
        location ^~ /static/resource/screenshot/ { return 404; }

        location ^~ /static/resource/ {
            alias /app/workspace/resource/;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=31536000";
        }

        location = /static/maintenance.html {
            alias /app/static/maintenance.html;
            types { }
            default_type text/html;
            charset utf-8;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Access-Control-Allow-Origin * always;
        }

        location /static/ {
            alias /app/static/;
            index index.html;

            proxy_cache static_cache;
            proxy_cache_valid 200 302 30d;
            proxy_cache_valid 404 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_revalidate on;
            proxy_cache_lock on;

            brotli_static on;
            gzip_static on;

            types {
                text/html html htm;
                text/plain txt;
                image/svg+xml svg;
                text/javascript js;
                text/css css;
                font/ttf ttf;
                font/woff woff;
                font/woff2 woff2;
                image/webp webp;
            }

            try_files $uri =404;

            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";
        }

        location = /403.html {
            root /app/static;
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location = /404.html {
            root /app/static;
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location = /500.html {
            root /app/static;
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location = /maintenance.html {
            root /app/static;
            internal;
            types { }
            default_type text/html;
            charset utf-8;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Retry-After "60" always;
        }

        location ^~ /maintenance-assets/ {
            alias /app/workspace/resource/system/;
            access_log off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
    }

    server {
        listen 80;
        client_max_body_size 32m;
        server_name o2k3sgzqpl3o6kmx22uqxhcz2bgb34kor46wmbqvsn7vzikfxn6y66ad.onion;
        set $app_backend trusted-web-main:8070;

        error_page 502 503 504 =503 /maintenance.html;

        location = /documentation {
            absolute_redirect off;
            return 301 /documentation/;
        }

        location = /documentation/ {
            absolute_redirect off;
            return 302 /documentation/app_docs/user_manual.html;
        }

        location ^~ /documentation/ {
            proxy_pass http://documentation/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        location / {
            if (-f /app/static/.maintenance) { return 503; }
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
                add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain charset=UTF-8';
                add_header Content-Length 0;
                return 204;
            }

            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;
        }

        location = /maintenance.html {
            root /app/static;
            internal;
            types { }
            default_type text/html;
            charset utf-8;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Retry-After "60" always;
        }

        location ^~ /maintenance-assets/ {
            alias /app/workspace/resource/system/;
            access_log off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
    }
}
