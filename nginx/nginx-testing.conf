worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    open_file_cache off;
    resolver 127.0.0.11 ipv6=off;
    resolver_timeout 2s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    server {
        listen 8080;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/local-certs/localhost-cert.pem;
        ssl_certificate_key /etc/nginx/local-certs/localhost-key.pem;
        client_max_body_size 32m;
        set $app_backend web:8070;

        error_page 502 503 504 =503 /maintenance.html;

        location = /api/test/ready {
            proxy_intercept_errors off;
            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/admin/backups/status {
            proxy_intercept_errors off;
            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/extension/socket {
            if (-f /app/static/.maintenance) { return 503; }
            proxy_intercept_errors off;
            proxy_pass http://$app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/public {
            if (-f /app/static/.maintenance) { return 503; }

            proxy_intercept_errors off;
            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            proxy_set_header Cache-Control "no-cache";
            proxy_set_header Pragma "no-cache";
            proxy_pass_request_headers on;
            proxy_ignore_headers Cache-Control Expires Vary;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            proxy_hide_header Vary;
            proxy_hide_header Age;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_cache off;

            expires off;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Surrogate-Control "no-store" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
                add_header Access-Control-Allow-Credentials true;
                add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0";
                add_header Pragma "no-cache";
                add_header Expires "0";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location = /documentation {
            absolute_redirect off;
            return 301 /documentation/;
        }

        location = /documentation/ {
            absolute_redirect off;
            return 302 /documentation/app_docs/user_manual.html;
        }

        location ^~ /documentation/ {
            proxy_pass http://documentation/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            if (-f /app/static/.maintenance) { return 503; }

            proxy_intercept_errors on;
            proxy_pass http://$app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
            add_header Access-Control-Allow-Credentials true;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=31536000";
            add_header Pragma "no-cache";
            add_header Expires 0;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
                add_header Access-Control-Allow-Credentials true;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location ^~ /static/resource/ {
            alias /app/workspace/resource/;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=31536000";
        }

        location /static/ {
            alias /app/static/;

            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=31536000";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }

        location ^~ /maintenance-assets/ {
            alias /app/workspace/resource/system/;
            access_log off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location = /maintenance.html {
            root /app/static;
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Retry-After "60" always;
        }

        location @fastapi_errors {
            proxy_pass http://$app_backend;
        }
    }
}
