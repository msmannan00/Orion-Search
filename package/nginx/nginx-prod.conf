worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    open_file_cache off;
    server_tokens off;
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name try.orionintelligence.org;

        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name try.orionintelligence.org;

        ssl_certificate /etc/letsencrypt/live/try.orionintelligence.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/try.orionintelligence.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        # ssl_stapling on;
        # ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 10s;

        error_page 404 /404.html;
        error_page 403 /403.html;
        error_page 405 500 502 503 504 /500.html;

        location = /robots.txt {
            alias /app/static/robots.txt;
            add_header Cache-Control "public, max-age=1";
        }

        location ^~ /api/s/static/system/ {
            proxy_pass http://web:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass_request_headers on;
            proxy_intercept_errors off;

            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }

        location = /api/s/static/favicon {
            proxy_pass http://web:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass_request_headers on;
            proxy_intercept_errors off;

            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /api/public {
            proxy_pass http://web:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            proxy_set_header Cache-Control "no-cache";
            proxy_set_header Pragma "no-cache";
            proxy_pass_request_headers on;
            proxy_intercept_errors off;
            proxy_ignore_headers Cache-Control Expires Vary;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            proxy_hide_header Vary;
            proxy_hide_header Age;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_cache off;

            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Surrogate-Control "no-store" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;
        }

        location = /api/insight {
            proxy_pass http://web:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass_request_headers on;
            proxy_intercept_errors off;

            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location ^~ /ext/ {
            proxy_pass http://web:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_pass_request_headers on;

            proxy_intercept_errors off;

            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /api/ {
            proxy_pass http://web:8070/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_pass_request_headers on;

            proxy_intercept_errors off;

            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location ~* ^/(?:runtime|polyfills|main|styles|common|[0-9]+)\.[^/]+\.(?:js|css|map)$ {
            root /client_build;
            try_files $uri =404;

            access_log off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location /assets/ {
            root /client_build;
            try_files $uri =404;

            access_log off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /api/parser {
            proxy_pass http://web:8070/api/parser;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_pass_request_headers on;
            proxy_intercept_errors off;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location = /api/extension/socket {
            proxy_intercept_errors off;
            proxy_pass http://web:8070;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location / {
            proxy_intercept_errors on;
            proxy_pass http://web:8070/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_pass_request_headers on;

            add_header Cache-Control "private, max-age=15, must-revalidate";
        }

        # Parser archives must be downloaded through /api/parser, which is
        # restricted to crawler and administrator accounts by the API.
        location = /static/.well-known { return 404; }
        location ^~ /static/.well-known/ { return 404; }

        # Breach screenshots must be served by the authenticated, licensed
        # /api/search/breach/screenshot/{id} endpoint used by breach reports.
        location = /static/resource/screenshot { return 404; }
        location ^~ /static/resource/screenshot/ { return 404; }

        location ^~ /static/resource/ {
            alias /app/workspace/resource/;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=31536000";
        }

        location /static/ {
            alias /app/static/;
            index index.html;
            include /etc/nginx/mime.types;

            proxy_cache static_cache;
            proxy_cache_valid 200 302 30d;
            proxy_cache_valid 404 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_revalidate on;
            proxy_cache_lock on;

            gzip_static on;

            types {
                image/svg+xml svg;
                text/javascript js;
                text/css css;
                font/ttf ttf;
                font/woff woff;
                font/woff2 woff2;
                image/webp webp;
            }

            try_files $uri =404;

            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";

            gzip on;
            gzip_types text/css application/javascript application/json text/xml;
        }

        location = /403.html {
            root /app/static;
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location = /404.html {
            root /app/static;
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location = /500.html {
            root /app/static;
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
