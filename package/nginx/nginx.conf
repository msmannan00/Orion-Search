worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    open_file_cache off;

    server {
        listen 8080;

        error_page 404 403 405 500 502 503 504 = @fastapi_errors;

        location = /api/public {
            proxy_intercept_errors off;
            proxy_pass http://web:8070;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            proxy_set_header Cache-Control "no-cache";
            proxy_set_header Pragma "no-cache";
            proxy_pass_request_headers on;
            proxy_ignore_headers Cache-Control Expires Vary;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            proxy_hide_header Vary;
            proxy_hide_header Age;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_cache off;

            expires off;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Surrogate-Control "no-store" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
                add_header Access-Control-Allow-Credentials true;
                add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0";
                add_header Pragma "no-cache";
                add_header Expires "0";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location = /api/extension/socket {
            proxy_intercept_errors off;
            proxy_pass http://web:8070;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location / {
            proxy_intercept_errors on;
            proxy_pass http://web:8070;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
            add_header Access-Control-Allow-Credentials true;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=31536000";
            add_header Pragma "no-cache";
            add_header Expires 0;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
                add_header Access-Control-Allow-Credentials true;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location /static/ {
            alias /backend/static/;
            include /etc/nginx/mime.types;

            types {
                image/svg+xml svg;
                text/javascript js;
                text/css css;
                font/ttf ttf;
                font/woff woff;
                font/woff2 woff2;
            }

            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=31536000";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }

        location @fastapi_errors {
            proxy_pass http://web:8070;
        }
    }
}
