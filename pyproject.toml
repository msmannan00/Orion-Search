[tool.poetry]
name = "orion-intelligence"
version = "1.0.3.8"
migration_version = "1.0.3.15"
description = "Orion Platform: A web-based OSINT solution integrating search, crawling, and data aggregation."
authors = ["Abdul Mannan <msmannan00@gmail.com>"]
license = "MIT"
homepage = "https://orion.genesistechnologies.org/"
repository = "https://github.com/msmannan00/Orion-Intelligence"
documentation = "https://orion-search.readthedocs.io/en/latest/"
readme = "https://orion-search.readthedocs.io/en/latest/"

[tool.poetry.dependencies]
python = "~3.12"
fastapi = "0.135.1"
starlette = "1.3.1"
pydantic = "2.12.5"
stopwords = "1.0.2"
python-dotenv = "1.2.2"
elasticsearch = "9.3.0"
termcolor = "3.3.0"
redis = "7.3.0"
motor = "3.7.1"
uvicorn = "0.42.0"
httpx = "0.28.1"
gunicorn = "25.1.0"
odmantic = "1.1.0"
starlette-admin = "0.16.1"
email-validator = "2.3.0"
pymongo = "4.16.0"
passlib = "1.7.4"
bcrypt = "4.0.1"
PyJWT = "2.13.0"

[tool.pytest.ini_options]
addopts = "--ignore=backend/routes/test_routes.py --ignore=routes/test_routes.py --ignore=backend/tests/routes --cov=backend/orion --cov-report=term-missing"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
    "static: isolated tests (unit/contract) allowed to use mocks/monkeypatch",
    "journey: end-to-end user journey tests; monkeypatch fixture is forbidden",
]
filterwarnings = [
    'ignore:Field name "schema" in "social_wanted" shadows an attribute in parent "BaseModel".*:UserWarning',
    "ignore:`FieldValidationInfo` is deprecated, use `ValidationInfo` instead.:DeprecationWarning:pydantic_core.*",
    "ignore:Pydantic V1 style `@root_validator` validators are deprecated.*",
    "ignore:Support for class-based `config` is deprecated, use ConfigDict instead.*:DeprecationWarning:pydantic.*",
    "ignore:`json_encoders` is deprecated.*:DeprecationWarning:pydantic.*",
    "ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*HTTP_422_UNPROCESSABLE_CONTENT.*:DeprecationWarning:starlette_admin(\\..*)?",
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14 or greater\\.:UserWarning:odmantic\\.typing",
]

[tool.coverage.run]
omit = [
    "*/__init__.py",
    "*/backend/routes/*",
    "*/configs/*",
    "*/orion/services/log_manager/log_controller.py",
]
